const $=id=>document.getElementById(id);let lang=localStorage.getItem('startingToolkitLanguage')||localStorage.getItem('startingToolkitLang')||'pt';if(!TXT[lang])lang='pt';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(){let o={};STORE.forEach(([id,key])=>{try{o[id]=JSON.parse(localStorage.getItem(key)||'null')}catch(e){o[id]=null}});return o}
function useful(v){if(v===null||v===undefined)return false;if(typeof v==='string')return v.trim()!=='';if(typeof v==='number')return Number.isFinite(v)&&v!==0;if(typeof v==='boolean')return v;if(Array.isArray(v))return v.some(useful);if(typeof v==='object')return Object.values(v).some(useful);return false}
function label(k){const t=TXT[lang];return t.labels[k]||k.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/[_-]/g,' ').replace(/^./,x=>x.toUpperCase())}
function val(v){if(v===null||v===undefined||v==='')return '';if(typeof v==='boolean')return v?(lang==='pt'?'Sim':lang==='es'?'Sí':'Yes'):(lang==='pt'?'Não':lang==='es'?'No':'No');if(Array.isArray(v))return v.map(val).filter(Boolean).join(' · ');if(typeof v==='object')return '';let s=String(v);const trans={franchise:{pt:'Franquia',en:'Franchise',es:'Franquicia'},'own brand':{pt:'Marca própria',en:'Own brand',es:'Marca propia'},undecided:{pt:'Ainda não decidido',en:'Undecided',es:'Aún sin decidir'},'not sure yet':{pt:'Ainda não sei',en:'Not sure yet',es:'Aún no lo sé'}};return esc(trans[s.toLowerCase()]?.[lang]||s)}
function row(k,v){if(!useful(v)||typeof v==='object')return '';let out=val(v);if(!out)return '';return `<div class="data-row"><div class="data-label">${esc(label(k))}</div><div class="data-value">${out}</div></div>`}
function rows(obj,omit=[]){if(!obj||typeof obj!=='object'||Array.isArray(obj))return '';return Object.entries(obj).filter(([k,v])=>!omit.includes(k)&&useful(v)).map(([k,v])=>{if(Array.isArray(v)){let x=v.map(val).filter(Boolean);return x.length?`<div class="data-row"><div class="data-label">${esc(label(k))}</div><div class="data-value">${x.join(' · ')}</div></div>`:''}if(v&&typeof v==='object')return '';return row(k,v)}).join('')}
