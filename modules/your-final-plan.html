
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Toolkit | Your Final Plan</title>
<style>
:root{--ink:#202b38;--muted:#687586;--line:#e1e7ec;--soft:#f4f7f8;--brand:#315c72;--accent:#d9a441;--green:#24734c}
*{box-sizing:border-box}
body{margin:0;background:#f2f5f7;color:var(--ink);font:15px/1.55 Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:25px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.logo{font-weight:800;letter-spacing:.08em;color:var(--brand);font-size:13px}
select,button{font:inherit}
.lang{border:1px solid var(--line);border-radius:9px;padding:8px;background:white;color:var(--ink)}
.hero{background:linear-gradient(135deg,#203f52,#3c7182);color:white;padding:34px;border-radius:20px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.13em;opacity:.8}
h1{font-size:clamp(30px,5vw,42px);line-height:1.1;margin:9px 0}
.hero p{color:#e5edf1;max-width:730px;margin:0}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.pill{background:#ffffff20;border:1px solid #ffffff35;border-radius:30px;padding:7px 12px;font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:white;font-weight:700;cursor:pointer}
.btn.gold{background:var(--accent);color:#29251d}
.btn.light{background:#edf2f5;color:var(--brand);border:1px solid #d7e0e6}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:23px;margin:16px 0;box-shadow:0 5px 18px #20304008}
.card h2{font-size:20px;margin:0 0 7px}
.card h3{font-size:15px;margin:18px 0 7px}
.tag{font-size:11px;font-weight:800;color:var(--brand);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.intro{color:var(--muted);margin:0 0 17px;font-size:14px}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.metric{background:var(--soft);padding:15px;border-radius:12px}
.metric span{display:block;font-size:12px;color:var(--muted)}
.metric strong{display:block;font-size:23px;margin-top:4px}
.statusbar{height:9px;background:#e6ebef;border-radius:20px;overflow:hidden;margin-top:14px}
.statusbar span{display:block;height:100%;background:var(--green);width:0}
.section{border-top:1px solid var(--line);padding-top:16px;margin-top:17px}
.section:first-child{border-top:0;padding-top:0;margin-top:0}
.section-title{font-size:16px;font-weight:750;margin-bottom:8px}
.data-list{display:grid;gap:8px}
.data-row{display:grid;grid-template-columns:minmax(150px, .8fr) minmax(0,1.5fr);gap:12px;padding:9px 0;border-bottom:1px solid #edf0f2}
.data-row:last-child{border-bottom:0}
.data-label{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.data-value{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.empty{padding:13px;background:var(--soft);border-radius:10px;color:var(--muted);font-size:13px}
.callout{background:#f8f6ef;border-left:3px solid var(--accent);border-radius:8px;padding:14px;color:#38434d;font-size:14px;margin-top:14px}
.decision{background:#203f52;color:white;border-radius:17px;padding:23px;margin:18px 0}
.decision h2{color:white;margin:0 0 7px}
.decision p{color:#e3edf1;margin:0}
.decision strong{color:#fff}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
.missing{color:#8a641f}
@media(max-width:650px){
.wrap{padding:18px 12px 40px}
.hero{padding:24px 20px}
.card{padding:17px}
.status-grid{grid-template-columns:1fr}
.data-row{grid-template-columns:1fr;gap:3px}
}
@media print{
body{background:white;color:#17202a}
.wrap{max-width:none;padding:0}
.top,.actions,.lang{display:none!important}
.hero{background:#203f52!important;color:white!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.card{box-shadow:none;break-inside:avoid;border:1px solid #ddd}
.decision{print-color-adjust:exact;-webkit-print-color-adjust:exact}
.statusbar span{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>

<section class="card">

const $=id=>document.getElementById(id);
let lang="pt";

function esc(value){
return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function readData(){
let result={};
KEYS.forEach(item=>{
try{
let raw=localStorage.getItem(item.key);
result[item.id]=raw?JSON.parse(raw):null;
}catch(e){result[item.id]=null;}
});
return result;
}

function labelize(value){
return String(value)
.replace(/([a-z0-9])([A-Z])/g,"$1 $2")
.replace(/[_-]/g," ")
.replace(/\b\w/g,c=>c.toUpperCase());
}

function useful(value){
if(value===null||value===undefined||value==="")return false;
if(typeof value==="number"||typeof value==="boolean")return true;
if(typeof value==="string")return value.trim().length>0;
if(Array.isArray(value))return value.length>0;
if(typeof value==="object")return Object.keys(value).length>0;
return false;
}

function formatValue(value){
const l=T[lang].labels;
if(value===null||value===undefined||value==="")return l.no;
if(typeof value==="boolean")return value?l.true:l.false;
if(typeof value==="number")return new Intl.NumberFormat(lang==="pt"?"pt-BR":lang==="es"?"es-ES":"en-US",{maximumFractionDigits:2}).format(value);
if(typeof value==="string")return value;
if(Array.isArray(value)){
if(value.length===0)return l.noData;
return value.map(formatValue).join(" • ");
}
if(typeof value==="object"){
return Object.entries(value)
.filter(([k,v])=>useful(v))
.map(([k,v])=>labelize(k)+": "+formatValue(v))
.join("\n");
}
return String(value);
}

function countValues(value){
if(!useful(value))return 0;
if(Array.isArray(value))return value.reduce((n,x)=>n+countValues(x),0)||1;
if(typeof value==="object")return Object.values(value).reduce((n,x)=>n+countValues(x),0);
return 1;
}

function moduleRows(id,data){
if(!data)return [];
let entries=Object.entries(data);
return entries.filter(([k,v])=>useful(v)&&!["language","lang","updatedAt","createdAt"].includes(k));
}

function renderSection(id,data){
const d=T[lang],title=d.sections[id],description=d.descriptions[id];
let html=`<section class="card">
<div class="tag">${title}</div>
<p class="intro">${description}</p>`;
if(!data){
html+=`<div class="empty missing">${d.emptySection}</div></section>`;
return html;
}
let rows=moduleRows(id,data);
if(rows.length===0){
html+=`<div class="empty">${d.emptySection}</div>`;
}else{
html+=`<div class="data-list">`;
rows.forEach(([key,value])=>{
html+=`<div class="data-row"><div class="data-label">${esc(labelize(key))}</div><div class="data-value">${esc(formatValue(value))}</div></div>`;
});
html+=`</div>`;
}
html+=`</section>`;
return html;
}

function getDecision(data,present){
let missing=8-present;
let numberData=data.numbers;
let profit=null;
if(numberData&&typeof numberData==="object"){
const candidates=["profit","operatingProfit","monthlyProfit","estimatedProfit"];
for(const key of candidates){
if(typeof numberData[key]==="number"){profit=numberData[key];break;}
}
}
if(missing===0)return ["start","startText"];
if(missing<=2)return ["validate","validateText"];
return ["refine","refineText"];
}

function render(){
const d=T[lang],data=readData();
document.documentElement.lang=lang==="pt"?"pt-BR":lang;
$("eyebrow").textContent=d.eyebrow;
$("title").textContent=d.title;
$("subtitle").textContent=d.subtitle;
$("dateLabel").textContent=d.date+" "+new Date().toLocaleDateString(lang==="pt"?"pt-BR":lang==="es"?"es-ES":"en-US");
$("modulesLabel").textContent=d.modules+": 8";
$("printButton").textContent=d.print;
$("refreshButton").textContent=d.refresh;
$("overviewTag").textContent=d.overviewTag;
$("overviewTitle").textContent=d.overviewTitle;
$("overviewIntro").textContent=d.overviewIntro;
$("m1label").textContent=d.completed;
$("m2label").textContent=d.progress;
$("m3label").textContent=d.recommendation;
$("overviewNote").textContent="";

let present=KEYS.filter(k=>data[k.id]&&moduleRows(k.id,data[k.id]).length>0).length;
let percent=Math.round(present/8*100);
$("m1").textContent=present+"/8";
$("m2").textContent=percent+"%";
$("m3").textContent=present===8?d.start:present>=6?d.validate:d.refine;
$("statusbar").style.width=percent+"%";
$("overviewNote").textContent=present===8?d.completeNote:d.partialNote;

$("planSections").innerHTML=KEYS.map(k=>renderSection(k.id,data[k.id])).join("");

let decision=getDecision(data,present);
$("decisionTag").textContent=d.decisionTag;
$("decisionTitle").textContent=d[decision[0]];
$("decisionText").textContent=d[decision[1]];

$("nextTag").textContent=d.nextTag;
$("nextTitle").textContent=d.nextTitle;
$("nextIntro").textContent=d.nextIntro;
$("nextSteps").innerHTML=d.steps.map((s,i)=>`<div class="data-row"><div class="data-label">${i+1}</div><div class="data-value">${esc(s)}</div></div>`).join("");
$("footer").textContent=d.footer;
}

$("language").addEventListener("change",e=>{lang=e.target.value;render()});
$("printButton").addEventListener("click",()=>window.print());
$("refreshButton").addEventListener("click",render);

render();
</script>
</body>
</html>
