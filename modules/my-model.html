function renderChecks(id,key,items){const el=$(id);el.innerHTML='';items.forEach((label,i)=>{const wrap=document.createElement('label');wrap.className='check';const input=document.createElement('input');input.type='checkbox';input.checked=state[key].includes(i);input.addEventListener('change',()=>{state[key]=input.checked?[...state[key],i]:state[key].filter(x=>x!==i);updateProgress();save(false)});const span=document.createElement('span');span.textContent=label;wrap.append(input,span);el.append(wrap)})}
function render(){const d=D[state.lang];document.documentElement.lang=state.lang==='pt'?'pt-BR':state.lang;$('language').value=state.lang;const map={eyebrow:'eyebrow',title:'title',lead:'lead',progressLabel:'progress',homeLink:'home',modelsTitle:'modelsTitle',modelsHelp:'modelsHelp',modelNote:'modelNote',revenueTitle:'revenueTitle',revenueHelp:'revenueHelp',channelTitle:'channelTitle',channelHelp:'channelHelp',deliveryTitle:'deliveryTitle',deliveryHelp:'deliveryHelp',resourcesTitle:'resourcesTitle',resourcesHelp:'resourcesHelp',resourcesOtherLabel:'resourcesOtherLabel',goalsTitle:'goalsTitle',goalsHelp:'goalsHelp',notesLabel:'notesLabel',decisionNote:'decisionNote',saveBtn:'save',summaryBtn:'summary',summaryTitle:'summaryTitle',summaryHelp:'summaryHelp',editBtn:'edit',continueBtn:'continue'};Object.entries(map).forEach(([id,k])=>$(id).textContent=d[k]);$('resourcesOther').placeholder=d.resourcesPlaceholder;$('notes').placeholder=d.notesPlaceholder;
const box=$('models');box.innerHTML='';models.forEach(key=>{const item=d.modelNames[key],b=document.createElement('button');b.type='button';b.className='option'+(state.businessModels.includes(key)?' selected':'');b.innerHTML='<strong></strong><span></span><span class="tag"></span>';b.querySelector('strong').textContent=item[0];b.querySelectorAll('span')[0].textContent=item[1];b.querySelector('.tag').textContent=item[2];b.addEventListener('click',()=>{state.businessModels=state.businessModels.includes(key)?state.businessModels.filter(x=>x!==key):[...state.businessModels,key];state.model=state.businessModels.length===1?state.businessModels[0]:state.businessModels.length?'hybrid':'';state.type=state.model;state.choice=state.model;state.businessModel=state.businessModels.join(',');save(false);render()});box.append(b)});
renderChecks('revenues','revenues',d.revenues);renderChecks('channels','channels',d.channels);renderChecks('deliveries','deliveries',d.deliveries);renderChecks('resources','resources',d.resources);renderChecks('goals','goals',d.goals);$('resourcesOther').value=state.resourcesOther;$('notes').value=state.notes;updateProgress()}
function updateProgress(){const total=7;let done=0;if(state.businessModels.length)done++;if(state.revenues.length)done++;if(state.channels.length)done++;if(state.deliveries.length)done++;if(state.resources.length||state.resourcesOther.trim())done++;if(state.goals.length)done++;if(state.notes.trim())done++;const pct=Math.round(done/total*100);$('progressPct').textContent=pct+'%';$('bar').style.width=pct+'%'}
function selectedLabels(key,list){return state[key].map(i=>list[i]).filter(Boolean)}
function recommendations(){const d=D[state.lang],chosen=state.businessModels;let rec=[];if(chosen.includes('product'))rec.push({name:d.modelNames.product[0],why:state.channels.includes(0)?'A physical point of sale appears among your chosen channels.':'You are considering selling tangible products.',watch:d.modelNames.product[1]});if(chosen.includes('service'))rec.push({name:d.modelNames.service[0],why:'You selected a service-based format.',watch:'Check your available hours, delivery capacity, pricing and dependence on your own time.'});if(chosen.includes('digital'))rec.push({name:d.modelNames.digital[0],why:'You are considering a digital offer that can potentially reach customers online.',watch:'Validate demand, content or product quality, platform costs and customer support.'});if(chosen.includes('subscription'))rec.push({name:d.modelNames.subscription[0],why:'Recurring payments may support more predictable revenue when customers see ongoing value.',watch:'Estimate churn, retention, recurring delivery costs and the effort required to keep subscribers.'});if(chosen.includes('marketplace'))rec.push({name:d.modelNames.marketplace[0],why:'Intermediation can create value by connecting two groups of users.',watch:'You need to attract both sides of the market, build trust and manage transaction or platform costs.'});if(chosen.includes('franchise'))rec.push({name:d.modelNames.franchise[0],why:'You may value an established brand, operating standards and support.',watch:'Review the full investment, disclosure documents, fees, territory, obligations and talk to current and former franchisees.'});if(chosen.includes('hybrid')||chosen.length>1)rec.push({name:d.modelNames.hybrid[0],why:'You selected more than one format or a hybrid approach.',watch:'Start with a manageable combination. Multiple channels or offers can increase operational complexity and costs.'});if(!rec.length&&state.goals.includes(0))rec.push({name:d.modelNames.service[0],why:'A service business can sometimes be tested with relatively limited initial infrastructure, depending on the activity.',watch:'Check required qualifications, tools, time, customer acquisition and legal requirements.'});return rec.slice(0,4)}

<script>
// Cloud sync: keep the existing module key and local backup for compatibility.
(()=>{const STORAGE_KEY='startingToolkitModelV1',MODULE_KEY='model',status=document.getElementById('saveStatus');const messages={pt:{saving:'Salvando na nuvem...',saved:'Salvo na nuvem.',local:'Salvo neste navegador. Faça login para sincronizar.',error:'Salvo neste dispositivo, mas houve um erro ao sincronizar.'},en:{saving:'Saving to the cloud...',saved:'Saved to the cloud.',local:'Saved in this browser. Log in to sync.',error:'Saved on this device, but cloud sync failed.'},es:{saving:'Guardando en la nube...',saved:'Guardado en la nube.',local:'Guardado en este navegador. Inicia sesión para sincronizar.',error:'Guardado en este dispositivo, pero no se pudo sincronizar.'}};const lang=()=>{try{return(localStorage.getItem('startingToolkitLanguage')||localStorage.getItem('startingToolkitLang')||'pt').slice(0,2)}catch(_){return'pt'}};const msg=k=>(messages[lang()]||messages.pt)[k];let authenticated=false,timer=null,chain=Promise.resolve(),busy=false;async function post(data){if(!authenticated){if(status)status.textContent=msg('local');return false}if(status)status.textContent=msg('saving');try{const response=await fetch(`/api/modules/${MODULE_KEY}`,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});const result=await response.json().catch(()=>({}));if(!response.ok||result.ok!==true||result.saved!==true)throw new Error(result.error||'Save failed');if(status)status.textContent=msg('saved');return true}catch(e){if(status)status.textContent=msg('error');return false}}function queue(data){if(!authenticated||busy)return;clearTimeout(timer);timer=setTimeout(()=>{chain=chain.then(()=>post(data))},700)}async function init(){try{const authRes=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});if(!authRes.ok){if(status)status.textContent=msg('local');return}const auth=await authRes.json();if(!auth.authenticated||!auth.businessPlanId){if(status)status.textContent=msg('local');return}authenticated=true;const cloudRes=await fetch(`/api/modules/${MODULE_KEY}`,{credentials:'same-origin',cache:'no-store'});if(!cloudRes.ok)throw new Error('Cloud load failed');const cloud=await cloudRes.json();const local=localStorage.getItem(STORAGE_KEY);if(cloud.data){const cloudText=JSON.stringify(cloud.data);if(local!==cloudText&&!sessionStorage.getItem('stk_cloud_hydrated_'+MODULE_KEY)){busy=true;localStorage.setItem(STORAGE_KEY,cloudText);sessionStorage.setItem('stk_cloud_hydrated_'+MODULE_KEY,'1');location.reload();return}if(status)status.textContent=msg('saved')}else if(local){let parsed;try{parsed=JSON.parse(local)}catch(_){parsed=null}if(parsed&&typeof parsed==='object')await post(parsed)}else if(status)status.textContent=msg('saved');const original=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){original.call(this,k,v);if(this===localStorage&&k===STORAGE_KEY&&authenticated&&!busy){try{queue(JSON.parse(v))}catch(_){}}}}catch(e){if(status)status.textContent=msg('error')}}init()})();
