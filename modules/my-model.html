<style>
:root{--navy:#19283d;--purple:#6c63ff;--soft:#f0efff;--bg:#f6f7fb;--muted:#667085;--line:#e4e7ec;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--navy);line-height:1.5}
button,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1080px;margin:auto;padding:24px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{font-weight:800;letter-spacing:2px;font-size:14px;color:inherit;text-decoration:none}
.top-right{display:flex;align-items:center;gap:12px}
.lang{border:1px solid var(--line);background:white;border-radius:10px;padding:9px}
.home{font-size:13px;color:var(--purple);text-decoration:none}
.hero{background:var(--navy);color:white;border-radius:22px;padding:28px 30px;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;opacity:.8}
.hero h1{font-size:30px;margin:8px 0}
.hero p{max-width:740px;margin:0;opacity:.88;font-size:15px}
.progress{margin-top:22px}
.progress-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.bar{height:8px;background:#ffffff30;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#b8e986;transition:width .2s}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:17px}
.section-title{font-size:20px;margin:0 0 6px}
.section-help{color:var(--muted);font-size:14px;margin:0 0 22px}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.choice{border:1px solid var(--line);border-radius:15px;padding:18px;background:white;text-align:left;color:var(--navy);min-height:145px}
.choice:hover{border-color:#aaa5ff}
.choice.selected{border:2px solid var(--purple);background:var(--soft);padding:17px}
.choice strong{display:block;font-size:16px;margin-bottom:7px}
.choice span{display:block;font-size:13px;color:var(--muted)}
.choice .check{display:block;color:var(--purple);font-size:12px;font-weight:700;margin-top:12px}
.guide{border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0;background:white}
.guide h3{font-size:16px;margin:0 0 7px}
.guide p{font-size:14px;color:var(--muted);margin:0 0 13px}
.guide label{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;cursor:pointer}
.guide input{width:17px;height:17px;accent-color:var(--purple);flex-shrink:0}
.guide.done{background:#f7f8fc;border-color:#c8c4ff}
.guide.done h3{color:var(--purple-dark,var(--purple))}
.guide-count{font-size:12px;color:var(--muted);margin-top:12px}
.reflection{margin-top:20px}
.reflection label{display:block;font-weight:700;margin-bottom:8px}
textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:11px;padding:12px;resize:vertical;color:var(--navy)}
textarea:focus{outline:2px solid #6c63ff30;border-color:var(--purple)}
.note{background:#f0f3f8;border:1px solid #dce4ee;border-radius:12px;padding:13px;color:#475467;font-size:13px;margin-top:14px}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.btn{border:0;border-radius:11px;padding:13px 18px;font-weight:700}
.primary{background:var(--purple);color:white}
.secondary{background:white;color:var(--navy);border:1px solid var(--line)}
.save{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.summary-item{border:1px solid var(--line);border-radius:13px;padding:14px}
.summary-item small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.summary-item strong{font-size:15px}
.hidden{display:none!important}
@media(max-width:700px){.choice-grid{grid-template-columns:1fr}.app{padding:15px 12px 40px}.hero{padding:23px 19px}.hero h1{font-size:25px}.card{padding:19px}.actions{flex-direction:column}.btn{width:100%}.summary-grid{grid-template-columns:1fr}}
</style>

function renderChoice(){
const d=D[state.lang];
const container=$("choices");
container.innerHTML="";
d.choices.forEach((choice,index)=>{
const button=document.createElement("button");
button.type="button";
button.className="choice";
button.classList.toggle("selected",state.model===["franchise","own","undecided"][index]);
button.innerHTML="<strong></strong><span></span><span class='check'></span>";
button.querySelector("strong").textContent=choice[0];
button.querySelector("span").textContent=choice[1];
button.querySelector(".check").textContent=state.model===["franchise","own","undecided"][index]?"✓":"";
button.addEventListener("click",()=>{
state.model=["franchise","own","undecided"][index];
render();
save(false);
});
container.appendChild(button);
});
}

container.innerHTML="";
items.forEach((item,index)=>{
const section=document.createElement("article");
section.className="guide";
section.classList.toggle("done",state[key].includes(index));
const title=document.createElement("h3");
title.textContent=(index+1)+". "+item[0];
const description=document.createElement("p");
description.textContent=item[1];
const label=document.createElement("label");
const checkbox=document.createElement("input");
checkbox.type="checkbox";
checkbox.checked=state[key].includes(index);
const span=document.createElement("span");
span.textContent=d.understood;
checkbox.addEventListener("change",()=>{
if(checkbox.checked){
if(!state[key].includes(index))state[key].push(index);
}else{
state[key]=state[key].filter(x=>x!==index);
}
renderGuide(containerId,items,key);
updateProgress();
save(false);
});
label.append(checkbox,span);
section.append(title,description,label);
container.appendChild(section);
});
}

function render(){
const d=D[state.lang];
document.documentElement.lang=state.lang==="pt"?"pt-BR":state.lang;
const textMap={
eyebrow:"eyebrow",title:"title",lead:"lead",
progressLabel:"progress",homeLink:"home",
choiceTitle:"choiceTitle",choiceHelp:"choiceHelp",
choiceNote:"choiceNote",franchiseTitle:"franchiseTitle",
franchiseIntro:"franchiseIntro",ownTitle:"ownTitle",
ownIntro:"ownIntro",reflectionTitle:"reflectionTitle",
reflectionHelp:"reflectionHelp",reflectionQuestion:"reflectionQuestion",
reflectionNote:"reflectionNote",saveBtn:"save",
summaryBtn:"summary",summaryTitle:"summaryTitle",
summaryHelp:"summaryHelp",editBtn:"edit",continueBtn:"continue"
};
Object.entries(textMap).forEach(([id,key])=>$(id).textContent=d[key]);
$("reflection").placeholder=d.reflectionPlaceholder;
$("language").value=state.lang;
renderChoice();
renderGuide("franchiseGuide",d.franchise,"understoodFranchise");
renderGuide("ownGuide",d.own,"understoodOwn");

$("franchiseSection").classList.toggle("hidden",state.model!=="franchise");
$("ownSection").classList.toggle("hidden",state.model!=="own");
$("reflectionSection").classList.toggle("hidden",!state.model);
$("reflection").value=state.reflection;

const fc=state.understoodFranchise.length;
const oc=state.understoodOwn.length;
$("franchiseCount").textContent=fc+" / "+d.franchise.length;
$("ownCount").textContent=oc+" / "+d.own.length;

updateProgress();
}

function updateProgress(){
let total=2;
let completed=state.model?1:0;
if(state.model==="franchise"){
total+=D[state.lang].franchise.length+1;
completed+=state.understoodFranchise.length;
}
if(state.model==="own"){
total+=D[state.lang].own.length+1;
completed+=state.understoodOwn.length;
}
if(state.model==="undecided")total+=1;
if(state.reflection.trim())completed++;
const pct=Math.round(completed/total*100);
$("progressPct").textContent=pct+"%";
$("bar").style.width=pct+"%";
}

function save(showMessage=true){
state.reflection=$("reflection").value.trim();
const d=D[state.lang];
const modelLabel=state.model==="franchise"?d.choiceLabels[0]:state.model==="own"?d.choiceLabels[1]:state.model==="undecided"?d.choiceLabels[2]:"";
const data={
...state,
model:state.model,
type:state.model,
choice:state.model,
businessModel:state.model,
modelLabel:modelLabel,
understoodFranchise:state.understoodFranchise,
understoodOwn:state.understoodOwn,
reflection:state.reflection,
updatedAt:new Date().toISOString()
};
localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
if(showMessage)$("saveStatus").textContent=d.saved;
}

function load(){
try{
const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
if(data){
Object.keys(state).forEach(key=>{
if(data[key]!==undefined)state[key]=data[key];
});
if(!Array.isArray(state.understoodFranchise))state.understoodFranchise=[];
if(!Array.isArray(state.understoodOwn))state.understoodOwn=[];
}
}catch(error){}
}

function showSummary(){
save(false);
const d=D[state.lang];
const model=state.model==="franchise"?d.choiceLabels[0]:state.model==="own"?d.choiceLabels[1]:state.model==="undecided"?d.choiceLabels[2]:d.notChosen;
const points=state.model==="franchise"?state.understoodFranchise:state.model==="own"?state.understoodOwn:[];
const items=state.model==="franchise"?d.franchise:state.model==="own"?d.own:[];
const understood=points.map(i=>items[i][0]).filter(Boolean);
const values=[
[d.modelLabel,model],
[d.understoodLabel,understood.length?understood.join(", "):d.none],
[d.reflectionLabel,state.reflection||"–"]
];
$("summaryGrid").innerHTML=values.map(item=>
`<div class="summary-item"><small>${escapeHTML(item[0])}</small><strong>${escapeHTML(item[1])}</strong></div>`
).join("");
$("summarySection").classList.remove("hidden");
$("summarySection").scrollIntoView({behavior:"smooth"});
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,char=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
})[char]);
}

$("language").addEventListener("change",()=>{
state.lang=$("language").value;
localStorage.setItem("startingToolkitLanguage",state.lang);
localStorage.setItem("startingToolkitLang",state.lang);
render();
save(false);
});

$("reflection").addEventListener("input",()=>{
state.reflection=$("reflection").value;
updateProgress();
save(false);
});

$("saveBtn").addEventListener("click",()=>save(true));
$("summaryBtn").addEventListener("click",showSummary);
$("editBtn").addEventListener("click",()=>{
$("summarySection").classList.add("hidden");
window.scrollTo({top:0,behavior:"smooth"});
});
$("continueBtn").addEventListener("click",()=>{
save(false);
window.location.href="my-market.html";
});

state.lang=localStorage.getItem("startingToolkitLanguage")||localStorage.getItem("startingToolkitLang")||"pt";
load();
render();
</script>
<script src="toolkit-navigation.js"></script>
</body>
</html>
