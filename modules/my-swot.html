<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starting Toolkit | My SWOT</title>
<style>
:root{--ink:#20272b;--muted:#68747a;--line:#dfe5e7;--bg:#f5f7f6;--card:#fff;--green:#246b5b;--green2:#e8f2ee;--blue:#eaf1f7;--orange:#fbf1e5;--red:#f8eaea;--shadow:0 8px 28px rgba(27,44,39,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}.wrap{max-width:1120px;margin:0 auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{font-weight:800;letter-spacing:.08em;color:var(--green);font-size:13px}.lang{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;color:var(--ink)}h1{font-size:34px;line-height:1.15;margin:10px 0}h2{font-size:21px;margin:0 0 8px}h3{font-size:16px;margin:0 0 8px}.intro{color:var(--muted);max-width:780px;margin:0 0 22px}.progress{height:7px;background:#e5eae8;border-radius:9px;overflow:hidden;margin:18px 0 28px}.progress span{display:block;height:100%;width:45%;background:var(--green)}.note{background:var(--green2);padding:14px 16px;border-radius:12px;color:#31594e;margin:18px 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.quad,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.quad.strength{border-top:5px solid #43866f}.quad.weakness{border-top:5px solid #c28a4b}.quad.opportunity{border-top:5px solid #5789b3}.quad.threat{border-top:5px solid #b96b6b}.sub{font-size:13px;color:var(--muted);margin:0 0 14px}.options{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}.option{border:1px solid var(--line);background:#fff;color:#344047;border-radius:999px;padding:7px 11px;font-size:13px;cursor:pointer}.option:hover{border-color:var(--green)}.option.selected{background:var(--green2);border-color:#8ab4a4;color:#245a4b}.selected-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}.items{display:flex;flex-direction:column;gap:8px;min-height:34px}.empty{font-size:13px;color:#899398;padding:8px 0}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f7f9f8;border:1px solid #e8edeb;border-radius:9px;padding:9px 10px}.item span{overflow-wrap:anywhere}.actions{display:flex;gap:5px;flex-shrink:0}.mini{border:0;background:transparent;color:var(--green);font-size:12px;cursor:pointer;padding:4px}.mini.delete{color:#a34c4c}.addrow{display:flex;gap:8px;margin-top:12px}.addrow input,.priority-add input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.btn{border:0;background:var(--green);color:#fff;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.secondary{background:#edf2ef;color:#31594e;border:1px solid #d8e5df}.panel{margin-top:22px}.panel-intro{color:var(--muted);margin:0 0 14px}.strategy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.strategy{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fbfcfb}.strategy strong{display:block;margin-bottom:5px}.strategy p{margin:0;color:var(--muted);font-size:13px}.priority-options{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.priority-list{display:flex;flex-direction:column;gap:9px}.priority{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:#f7f9f8;border:1px solid #e8edeb;border-radius:10px;padding:10px}.priority select{border:1px solid var(--line);border-radius:8px;padding:7px;background:white}.priority-add{display:flex;gap:8px;margin-top:12px}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:24px;align-items:center}.status{font-size:13px;color:var(--muted)}.summary{white-space:pre-wrap;background:#f7f9f8;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px;color:#39464a}.hidden{display:none!important}@media(max-width:760px){.grid,.strategy-grid{grid-template-columns:1fr}.wrap{padding:20px 13px 40px}h1{font-size:29px}.top{align-items:flex-start}.priority{grid-template-columns:1fr auto}.priority select{grid-column:1}.priority .mini{grid-column:2;grid-row:1}.footer{align-items:stretch;flex-direction:column}.addrow,.priority-add{flex-direction:column}.btn{width:100%}}
</style></head>
<body><main class="wrap">
<div class="top"><div class="brand">STARTING TOOLKIT</div><select class="lang" id="lang" aria-label="Language"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select></div>
<h1 id="title">My SWOT</h1><p class="intro" id="intro"></p><div class="progress"><span></span></div>
<div class="note" id="note"></div>
<section class="grid" id="quadrants"></section>
<section class="panel"><h2 id="strategyTitle"></h2><p class="panel-intro" id="strategyIntro"></p><div class="strategy-grid" id="strategies"></div></section>
<section class="panel"><h2 id="priorityTitle"></h2><p class="panel-intro" id="priorityIntro"></p><div class="priority-options" id="priorityOptions"></div><div class="priority-list" id="priorityList"></div><div class="priority-add"><input id="customPriority" type="text"><button class="btn" id="addPriority"></button></div></section>
<section class="panel"><h2 id="snapshotTitle"></h2><p class="panel-intro" id="snapshotIntro"></p><div class="summary" id="snapshot"></div></section>
<div class="footer"><span class="status" id="saveStatus"></span><button class="btn" id="continueBtn"></button></div>
</main>
<script>window.STK_CLOUD_SYNC={key:"startingToolkitSWOTV2",endpoint:"/api/modules/swot"};</script>
<script src="module-cloud-sync.js"></script>
<script>
const KEY='startingToolkitSWOTV2';
const T={
pt:{title:'My SWOT',intro:'Mapeie o que favorece ou dificulta seu negócio. Escolha as opções que fazem sentido e personalize a análise com a sua realidade.',note:'Forças e fraquezas são fatores internos, ligados ao próprio negócio. Oportunidades e ameaças são fatores externos, ligados ao mercado e ao ambiente. Você pode selecionar várias opções, editar os itens escolhidos ou acrescentar os seus.',quadrants:[['strength','Forças','O que o negócio já tem ou faz bem.','Experiência no setor','Conhecimento técnico','Boa localização','Marca forte ou reconhecida','Diferencial claro','Boa capacidade operacional','Relacionamento com clientes','Custos operacionais competitivos','Tecnologia e ferramentas adequadas','Equipe qualificada','Rede de contatos e parcerias'],['weakness','Fraquezas','O que precisa ser desenvolvido ou melhorado.','Pouca experiência no setor','Marca ainda desconhecida','Capital limitado','Dependência de fornecedores','Equipe pequena ou inexistente','Presença digital fraca','Pouco poder de negociação','Processos ainda não definidos','Baixa capacidade de atendimento','Falta de indicadores e controles'],['opportunity','Oportunidades','Condições externas que podem favorecer o negócio.','Demanda crescente','Público pouco atendido','Concorrentes com avaliações negativas','Região com oferta limitada','Novos hábitos de consumo','Tendências favoráveis','Novas tecnologias','Possibilidade de parcerias','Novos canais de venda','Mudanças no mercado que abrem espaço'],['threat','Ameaças','Condições externas que podem prejudicar o negócio.','Concorrência forte','Guerra de preços','Entrada de novos concorrentes','Dependência de plataformas','Aumento de custos','Mudanças regulatórias','Sazonalidade da demanda','Mudanças tecnológicas rápidas','Poucos fornecedores disponíveis','Queda no poder de compra']],strategyTitle:'Da análise à estratégia',strategyIntro:'Use as combinações abaixo para pensar em como agir. Elas são perguntas-guia, não respostas automáticas.',strategies:[['Forças + Oportunidades','Como usar seus pontos fortes para aproveitar oportunidades?'],['Forças + Ameaças','Como seus pontos fortes podem reduzir os riscos externos?'],['Fraquezas + Oportunidades','O que precisa melhorar para aproveitar uma oportunidade?'],['Fraquezas + Ameaças','Como reduzir vulnerabilidades e se proteger dos riscos?']],priorityTitle:'Prioridades estratégicas',priorityIntro:'Selecione o que merece atenção primeiro. Depois, defina o nível de prioridade. Você pode incluir uma prioridade específica do seu negócio.',priorityOptions:['Validar a demanda antes de investir','Rever o investimento inicial e o capital de giro','Encontrar ou avaliar fornecedores','Definir melhor o público e o posicionamento','Fortalecer a presença digital','Ajustar preços e margens','Melhorar processos e operação','Desenvolver competências ou contratar equipe','Reduzir dependência de um fornecedor ou canal','Formalizar licenças e exigências legais','Testar a oferta com clientes reais','Criar parcerias comerciais'],snapshotTitle:'Resumo da sua análise',snapshotIntro:'Os itens abaixo são atualizados conforme você seleciona, edita ou exclui informações.',addPlaceholder:'Escreva outro item...',addBtn:'Adicionar item',priorityPlaceholder:'Escreva outra prioridade...',priorityAdd:'Adicionar prioridade',understand:'',empty:'Nenhum item selecionado ainda.',edit:'Editar',remove:'Excluir',levels:['Alta','Média','Baixa'],saved:'Salvo automaticamente.',continue:'Continuar para My Numbers',editPrompt:'Edite o texto do item:',removeConfirm:'Excluir este item?',priorityEmpty:'Nenhuma prioridade selecionada ainda.',summaryLabels:['FORÇAS','FRAQUEZAS','OPORTUNIDADES','AMEAÇAS','PRIORIDADES'],levelLabel:'Prioridade'},
en:{title:'My SWOT',intro:'Map what helps or challenges your business. Choose relevant suggestions and customize the analysis to your situation.',note:'Strengths and weaknesses are internal factors related to the business itself. Opportunities and threats are external factors related to the market and environment. Select multiple suggestions, edit selected items or add your own.',quadrants:[['strength','Strengths','What the business already has or does well.','Industry experience','Technical knowledge','Good location','Strong or recognized brand','Clear differentiation','Strong operational capacity','Customer relationships','Competitive operating costs','Suitable technology and tools','Qualified team','Network and partnerships'],['weakness','Weaknesses','What needs to be developed or improved.','Limited industry experience','Unknown brand','Limited capital','Supplier dependence','Small or no team','Weak digital presence','Low bargaining power','Undefined processes','Limited service capacity','Lack of metrics and controls'],['opportunity','Opportunities','External conditions that may benefit the business.','Growing demand','Underserved audience','Competitors with poor reviews','Underserved region','New consumer habits','Favorable trends','New technologies','Partnership opportunities','New sales channels','Market changes creating space'],['threat','Threats','External conditions that may harm the business.','Strong competition','Price wars','New competitors entering','Platform dependence','Rising costs','Regulatory changes','Seasonality','Rapid technological change','Limited supplier options','Declining purchasing power']],strategyTitle:'From analysis to strategy',strategyIntro:'Use these combinations to think about actions. They are guiding questions, not automatic answers.',strategies:[['Strengths + Opportunities','How can you use your strengths to capture opportunities?'],['Strengths + Threats','How can your strengths reduce external risks?'],['Weaknesses + Opportunities','What needs to improve to capture an opportunity?'],['Weaknesses + Threats','How can you reduce vulnerabilities and protect the business?']],priorityTitle:'Strategic priorities',priorityIntro:'Choose what deserves attention first, then set its priority level. You can also add a priority specific to your business.',priorityOptions:['Validate demand before investing','Review initial investment and working capital','Find or assess suppliers','Clarify target audience and positioning','Strengthen digital presence','Adjust pricing and margins','Improve processes and operations','Develop skills or hire a team','Reduce dependence on one supplier or channel','Confirm licenses and legal requirements','Test the offer with real customers','Build commercial partnerships'],snapshotTitle:'Your SWOT summary',snapshotIntro:'This summary updates as you select, edit or remove information.',addPlaceholder:'Add another item...',addBtn:'Add item',priorityPlaceholder:'Add another priority...',priorityAdd:'Add priority',edit:'Edit',remove:'Delete',empty:'No items selected yet.',levels:['High','Medium','Low'],saved:'Automatically saved.',continue:'Continue to My Numbers',editPrompt:'Edit this item:',removeConfirm:'Delete this item?',priorityEmpty:'No priorities selected yet.',summaryLabels:['STRENGTHS','WEAKNESSES','OPPORTUNITIES','THREATS','PRIORITIES'],levelLabel:'Priority'},
es:{title:'My SWOT',intro:'Identifica lo que favorece o dificulta tu negocio. Elige las opciones relevantes y adapta el análisis a tu realidad.',note:'Las fortalezas y debilidades son factores internos, relacionados con el propio negocio. Las oportunidades y amenazas son factores externos, relacionados con el mercado y el entorno. Puedes seleccionar varias opciones, editar los elementos elegidos o añadir los tuyos.',quadrants:[['strength','Fortalezas','Lo que el negocio ya tiene o hace bien.','Experiencia en el sector','Conocimiento técnico','Buena ubicación','Marca fuerte o reconocida','Diferenciación clara','Buena capacidad operativa','Relación con clientes','Costes operativos competitivos','Tecnología y herramientas adecuadas','Equipo cualificado','Red de contactos y alianzas'],['weakness','Debilidades','Lo que necesita desarrollarse o mejorarse.','Poca experiencia en el sector','Marca aún desconocida','Capital limitado','Dependencia de proveedores','Equipo pequeño o inexistente','Presencia digital débil','Poco poder de negociación','Procesos aún no definidos','Capacidad de atención limitada','Falta de indicadores y controles'],['opportunity','Oportunidades','Condiciones externas que pueden favorecer el negocio.','Demanda creciente','Público poco atendido','Competidores con malas reseñas','Región con oferta limitada','Nuevos hábitos de consumo','Tendencias favorables','Nuevas tecnologías','Posibilidad de alianzas','Nuevos canales de venta','Cambios de mercado que abren espacio'],['threat','Amenazas','Condiciones externas que pueden perjudicar el negocio.','Competencia fuerte','Guerra de precios','Entrada de nuevos competidores','Dependencia de plataformas','Aumento de costes','Cambios regulatorios','Estacionalidad de la demanda','Cambios tecnológicos rápidos','Pocos proveedores disponibles','Caída del poder adquisitivo']],strategyTitle:'Del análisis a la estrategia',strategyIntro:'Usa estas combinaciones para pensar en acciones. Son preguntas guía, no respuestas automáticas.',strategies:[['Fortalezas + Oportunidades','¿Cómo aprovechar tus fortalezas para captar oportunidades?'],['Fortalezas + Amenazas','¿Cómo pueden tus fortalezas reducir los riesgos externos?'],['Debilidades + Oportunidades','¿Qué debes mejorar para aprovechar una oportunidad?'],['Debilidades + Amenazas','¿Cómo reducir vulnerabilidades y proteger el negocio?']],priorityTitle:'Prioridades estratégicas',priorityIntro:'Elige qué merece atención primero y define su nivel de prioridad. También puedes añadir una prioridad específica de tu negocio.',priorityOptions:['Validar la demanda antes de invertir','Revisar la inversión inicial y el capital de trabajo','Encontrar o evaluar proveedores','Definir mejor el público y el posicionamiento','Fortalecer la presencia digital','Ajustar precios y márgenes','Mejorar procesos y operación','Desarrollar capacidades o contratar equipo','Reducir la dependencia de un proveedor o canal','Confirmar licencias y requisitos legales','Probar la oferta con clientes reales','Crear alianzas comerciales'],snapshotTitle:'Resumen de tu análisis',snapshotIntro:'Este resumen se actualiza cuando seleccionas, editas o eliminas información.',addPlaceholder:'Añadir otro elemento...',addBtn:'Añadir elemento',priorityPlaceholder:'Añadir otra prioridad...',priorityAdd:'Añadir prioridad',edit:'Editar',remove:'Eliminar',empty:'Aún no hay elementos seleccionados.',levels:['Alta','Media','Baja'],saved:'Guardado automáticamente.',continue:'Continuar a My Numbers',editPrompt:'Edita el texto:',removeConfirm:'¿Eliminar este elemento?',priorityEmpty:'Aún no hay prioridades seleccionadas.',summaryLabels:['FORTALEZAS','DEBILIDADES','OPORTUNIDADES','AMENAZAS','PRIORIDADES'],levelLabel:'Prioridad'}
};
let lang='pt';let data={strength:[],weakness:[],opportunity:[],threat:[],priorities:[]};
try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');if(old&&typeof old==='object'){for(const k of ['strength','weakness','opportunity','threat']){if(Array.isArray(old[k]))data[k]=old[k].map(x=>typeof x==='string'?{text:x,custom:true}:x).filter(x=>x&&x.text)}if(Array.isArray(old.priorities))data.priorities=old.priorities.map(x=>typeof x==='string'?{text:x,level:'medium',custom:true}:x).filter(x=>x&&x.text)}}catch(e){}
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data));$('saveStatus').textContent=T[lang].saved;renderItems();renderSnapshot()}
function has(k,text){return data[k].some(x=>x.text.toLowerCase()===text.toLowerCase())}
function add(k,text,custom=true){text=text.trim();if(!text||has(k,text))return;data[k].push({text,custom});save()}
function removeItem(k,i){if(confirm(T[lang].removeConfirm)){data[k].splice(i,1);save()}}
function editItem(k,i){const v=prompt(T[lang].editPrompt,data[k][i].text);if(v===null)return;const text=v.trim();if(!text)return;data[k][i].text=text;save()}
function render(){const t=T[lang];document.documentElement.lang=lang==='pt'?'pt-BR':lang;$('title').textContent=t.title;$('intro').textContent=t.intro;$('note').textContent=t.note;$('strategyTitle').textContent=t.strategyTitle;$('strategyIntro').textContent=t.strategyIntro;$('priorityTitle').textContent=t.priorityTitle;$('priorityIntro').textContent=t.priorityIntro;$('snapshotTitle').textContent=t.snapshotTitle;$('snapshotIntro').textContent=t.snapshotIntro;$('customPriority').placeholder=t.priorityPlaceholder;$('addPriority').textContent=t.priorityAdd;$('continueBtn').textContent=t.continue;
$('quadrants').innerHTML=t.quadrants.map(q=>`<article class="quad ${q[0]}"><h2>${q[1]}</h2><p class="sub">${q[2]}</p><div class="options">${q.slice(3).map(v=>`<button class="option ${has(q[0],v)?'selected':''}" data-k="${q[0]}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div><div class="selected-title">${lang==='pt'?'Itens selecionados':lang==='es'?'Elementos seleccionados':'Selected items'}</div><div class="items" id="items-${q[0]}"></div><div class="addrow"><input id="new-${q[0]}" placeholder="${t.addPlaceholder}"><button class="btn secondary" data-add="${q[0]}">${t.addBtn}</button></div></article>`).join('');
$('strategies').innerHTML=t.strategies.map(s=>`<div class="strategy"><strong>${s[0]}</strong><p>${s[1]}</p></div>`).join('');$('priorityOptions').innerHTML=t.priorityOptions.map(v=>`<button class="option ${data.priorities.some(x=>x.text.toLowerCase()===v.toLowerCase())?'selected':''}" data-priority="${esc(v)}">${esc(v)}</button>`).join('');renderItems();renderPriorities();renderSnapshot();}
function renderItems(){const t=T[lang];['strength','weakness','opportunity','threat'].forEach(k=>{const el=$('items-'+k);if(!el)return;el.innerHTML=data[k].length?data[k].map((x,i)=>`<div class="item"><span>${esc(x.text)}</span><div class="actions"><button class="mini" data-edit="${k}" data-i="${i}">${t.edit}</button><button class="mini delete" data-remove="${k}" data-i="${i}">${t.remove}</button></div></div>`).join(''):`<div class="empty">${t.empty}</div>`})}
function renderPriorities(){const t=T[lang];$('priorityList').innerHTML=data.priorities.length?data.priorities.map((p,i)=>`<div class="priority"><span>${esc(p.text)}</span><select data-level="${i}"><option value="high" ${p.level==='high'?'selected':''}>${t.levels[0]}</option><option value="medium" ${p.level==='medium'?'selected':''}>${t.levels[1]}</option><option value="low" ${p.level==='low'?'selected':''}>${t.levels[2]}</option></select><button class="mini delete" data-premove="${i}">${t.remove}</button></div>`).join(''):`<div class="empty">${t.priorityEmpty}</div>`}
function renderSnapshot(){const t=T[lang];const keys=['strength','weakness','opportunity','threat'];$('snapshot').textContent=keys.map((k,i)=>t.summaryLabels[i]+'\n'+(data[k].length?data[k].map(x=>'• '+x.text).join('\n'):'-')).join('\n\n')+'\n\n'+t.summaryLabels[4]+'\n'+(data.priorities.length?data.priorities.map(p=>'• '+p.text+' ('+({high:t.levels[0],medium:t.levels[1],low:t.levels[2]}[p.level]||t.levels[1])+')').join('\n'):'-')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.k){const k=b.dataset.k,v=b.dataset.v;has(k,v)?data[k].splice(data[k].findIndex(x=>x.text.toLowerCase()===v.toLowerCase()),1):add(k,v,false);save();render()}if(b.dataset.add){const k=b.dataset.add;add(k,$('new-'+k).value,true);$('new-'+k).value='';render()}if(b.dataset.edit!==undefined)editItem(b.dataset.edit,+b.dataset.i);if(b.dataset.remove!==undefined)removeItem(b.dataset.remove,+b.dataset.i);if(b.dataset.priority){const v=b.dataset.priority;const i=data.priorities.findIndex(x=>x.text.toLowerCase()===v.toLowerCase());i>=0?data.priorities.splice(i,1):data.priorities.push({text:v,level:'medium',custom:false});save();render()}if(b.dataset.premove!==undefined){if(confirm(T[lang].removeConfirm)){data.priorities.splice(+b.dataset.premove,1);save();renderPriorities()}}});
document.addEventListener('change',e=>{if(e.target.dataset.level!==undefined){data.priorities[+e.target.dataset.level].level=e.target.value;save();renderSnapshot()}});
$('addPriority').addEventListener('click',()=>{const v=$('customPriority').value.trim();if(v&&!data.priorities.some(p=>p.text.toLowerCase()===v.toLowerCase()))data.priorities.push({text:v,level:'medium',custom:true});$('customPriority').value='';save();render()});$('customPriority').addEventListener('keydown',e=>{if(e.key==='Enter')$('addPriority').click()});$('lang').addEventListener('change',e=>{lang=e.target.value;render()});$('continueBtn').addEventListener('click',()=>location.href='my-numbers.html');render();
</script><script src="toolkit-navigation.js"></script></body></html>
