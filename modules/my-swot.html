
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Toolkit | My SWOT</title>
<style>
:root{--navy:#19283d;--purple:#6c63ff;--soft:#f0efff;--bg:#f6f7fb;--muted:#667085;--line:#e4e7ec;--green:#258568;--red:#c56b64;--blue:#527db5;--gold:#b58a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--navy);line-height:1.5}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1080px;margin:auto;padding:24px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{font-weight:800;letter-spacing:2px;font-size:14px;color:inherit;text-decoration:none}
.top-right{display:flex;align-items:center;gap:12px}
.lang{border:1px solid var(--line);background:white;border-radius:10px;padding:9px}
.home{font-size:13px;color:var(--purple);text-decoration:none}
.hero{background:var(--navy);color:white;border-radius:22px;padding:28px 30px;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;opacity:.8}
.hero h1{font-size:30px;margin:8px 0}
.hero p{max-width:740px;margin:0;opacity:.88;font-size:15px}
.progress{margin-top:22px}
.progress-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.bar{height:8px;background:#ffffff30;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#b8e986;transition:width .2s}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:17px}
.section-title{font-size:20px;margin:0 0 6px}
.section-help{color:var(--muted);font-size:14px;margin:0 0 20px}
.note{background:#f0f3f8;border:1px solid #dce4ee;border-radius:12px;padding:13px;color:#475467;font-size:13px;margin:12px 0}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.quadrant{border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}
.quadrant h3{margin:0 0 5px;font-size:17px}
.quadrant .desc{font-size:13px;color:var(--muted);margin:0 0 14px;min-height:38px}
.quadrant.strength{border-top:4px solid var(--green)}
.quadrant.weakness{border-top:4px solid var(--red)}
.quadrant.opportunity{border-top:4px solid var(--blue)}
.quadrant.threat{border-top:4px solid var(--gold)}
.items{display:grid;gap:8px}
.item{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
.item input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--purple);flex-shrink:0}
.custom{display:flex;gap:7px;margin-top:13px}
.custom input{min-width:0;flex:1}
input,textarea{border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--navy);background:white;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6c63ff18}
.add{background:var(--navy);color:white;border:0;border-radius:10px;padding:0 13px;font-weight:700;white-space:nowrap}
.custom-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tag{background:var(--soft);color:#5148d9;border-radius:20px;padding:6px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
.tag button{border:0;background:transparent;color:inherit;font-weight:bold;padding:0}
.strategy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.strategy{border:1px solid var(--line);border-radius:13px;padding:15px}
.strategy h3{font-size:15px;margin:0 0 6px}
.strategy p{font-size:13px;color:var(--muted);margin:0 0 12px}
.strategy textarea{min-height:85px;resize:vertical}
.priority-list{display:grid;gap:10px}
.priority-row{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center}
.priority-row input{min-width:0}
.priority-row select{border:1px solid var(--line);border-radius:10px;padding:11px;background:white;color:var(--navy);width:100%}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.btn{border:0;border-radius:11px;padding:13px 18px;font-weight:700}
.primary{background:var(--purple);color:white}
.secondary{background:white;color:var(--navy);border:1px solid var(--line)}
.save{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.summary-item{border:1px solid var(--line);border-radius:13px;padding:14px;overflow-wrap:anywhere}
.summary-item small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.summary-item div{font-size:14px;white-space:pre-wrap}
.hidden{display:none!important}
@media(max-width:700px){
.app{padding:15px 12px 40px}.hero{padding:23px 19px}.hero h1{font-size:25px}
.card{padding:19px}.matrix,.strategy-grid,.summary-grid{grid-template-columns:1fr}
.actions{flex-direction:column}.btn{width:100%}
.priority-row{grid-template-columns:1fr}
.custom{flex-wrap:wrap}.custom input{flex-basis:100%}.add{padding:11px 14px}
}
</style>
</head>

</div>

const groups=["strength","weakness","opportunity","threat"];
const customKeys={strength:"customStrength",weakness:"customWeakness",opportunity:"customOpportunity",threat:"customThreat"};

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function renderGroup(key){
const d=D[state.lang];
const list=$(key+"Items");
list.innerHTML="";
d[key].forEach((label,index)=>{
const row=document.createElement("label");
row.className="item";
const check=document.createElement("input");
check.type="checkbox";
check.checked=state[key].includes(index);
const span=document.createElement("span");
span.textContent=label;
check.addEventListener("change",()=>{
if(check.checked){if(!state[key].includes(index))state[key].push(index)}
else state[key]=state[key].filter(i=>i!==index);
updateProgress();save(false);
});
row.append(check,span);
list.appendChild(row);
});
renderCustom(key);
}
function renderCustom(key){
const d=D[state.lang],container=$(customKeys[key]+"List");
container.innerHTML="";
state[customKeys[key]].forEach((value,index)=>{
const tag=document.createElement("span");
tag.className="tag";
const text=document.createElement("span");text.textContent=value;
const remove=document.createElement("button");
remove.type="button";remove.textContent="×";remove.setAttribute("aria-label","Remove "+value);
remove.addEventListener("click",()=>{
state[customKeys[key]].splice(index,1);
renderCustom(key);updateProgress();save(false);
});
tag.append(text,remove);container.appendChild(tag);
});
$(key+"CustomInput").placeholder=d.otherPlaceholder;
$(key+"Add").textContent=d.add;
}
function addCustom(key){
const input=$(key+"CustomInput");
const value=input.value.trim();
if(!value)return;
if(!state[customKeys[key]].includes(value)){
state[customKeys[key]].push(value);
}
input.value="";
renderCustom(key);updateProgress();save(false);
}
function renderStrategies(){
const d=D[state.lang],root=$("strategyGrid");
root.innerHTML="";
d.strategies.forEach(([title,description,key])=>{
const card=document.createElement("div");card.className="strategy";
const h=document.createElement("h3");h.textContent=title;
const p=document.createElement("p");p.textContent=description;
const area=document.createElement("textarea");
area.value=state.strategy[key]||"";
area.addEventListener("input",()=>{state.strategy[key]=area.value;updateProgress();save(false)});
card.append(h,p,area);root.appendChild(card);
});
}
function renderPriorities(){
const d=D[state.lang],root=$("priorityList");
root.innerHTML="";
state.priorities.forEach((item,index)=>{
const row=document.createElement("div");row.className="priority-row";
const input=document.createElement("input");
input.value=item.text||"";
input.placeholder=d.priorityPlaceholder;
input.addEventListener("input",()=>{item.text=input.value;updateProgress();save(false)});
const select=document.createElement("select");
d.priorityOptions.forEach((v,i)=>{
const o=document.createElement("option");o.value=String(i);o.textContent=v;select.appendChild(o);
});
select.value=String(item.level??1);
select.addEventListener("change",()=>{item.level=Number(select.value);save(false)});
row.append(input,select);root.appendChild(row);
});
}

const d=D[state.lang];
document.documentElement.lang=state.lang==="pt"?"pt-BR":state.lang;
const map={
eyebrow:"eyebrow",title:"title",lead:"lead",progressLabel:"progress",homeLink:"home",

strengthTitle:"strengthTitle",strengthDesc:"strengthDesc",
weaknessTitle:"weaknessTitle",weaknessDesc:"weaknessDesc",
opportunityTitle:"opportunityTitle",opportunityDesc:"opportunityDesc",
threatTitle:"threatTitle",threatDesc:"threatDesc",
strategyTitle:"strategyTitle",strategyHelp:"strategyHelp",
prioritiesTitle:"priorityTitle",prioritiesHelp:"priorityHelp",
priorityAdd:"addPriority",saveBtn:"save",summaryBtn:"summary",
resultTitle:"resultTitle",resultHelp:"resultHelp",editBtn:"edit",continueBtn:"continue"
};
Object.entries(map).forEach(([id,key])=>$(id).textContent=d[key]);
$("priorityInput").placeholder=d.priorityPlaceholderInput;
groups.forEach(renderGroup);
renderStrategies();renderPriorities();updateProgress();
}
function updateProgress(){
let total=4,done=0;
groups.forEach(key=>{
total+=D[state.lang][key].length+1;
done+=state[key].length+state[customKeys[key]].length;
if(state[key].length||state[customKeys[key]].length)done++;
});
total+=4+5;
done+=Object.values(state.strategy).filter(v=>v.trim()).length;
done+=state.priorities.filter(p=>p.text.trim()).length;
const pct=Math.min(100,Math.round(done/total*100));
$("progressPct").textContent=pct+"%";
$("bar").style.width=pct+"%";
}
function save(show=true){
const data={...state,updatedAt:new Date().toISOString()};
localStorage.setItem(KEY,JSON.stringify(data));
if(show)$("saveStatus").textContent=D[state.lang].saved;
}
function load(){
try{
const data=JSON.parse(localStorage.getItem(KEY)||"null");
if(!data)return;
Object.keys(state).forEach(key=>{
if(data[key]!==undefined)state[key]=data[key];
});
groups.forEach(key=>{
if(!Array.isArray(state[key]))state[key]=[];
if(!Array.isArray(state[customKeys[key]]))state[customKeys[key]]=[];
});
if(!state.strategy||typeof state.strategy!=="object")state.strategy={so:"",st:"",wo:"",wt:""};
if(!Array.isArray(state.priorities))state.priorities=[];
}catch(e){}
}
function showSummary(){
save(false);
const d=D[state.lang];
const values=[
groups.map(k=>[...state[k].map(i=>d[k][i]),...state[customKeys[k]]].join("\n")||d.none),
Object.values(state.strategy).map(v=>v||d.none),
state.priorities.filter(p=>p.text.trim()).map(p=>p.text+" ("+d.priorityOptions[p.level??1]+")").join("\n")||d.none
];
const labels=d.labels;
const content=[
...values[0],
...values[1],
values[2]
];
$("resultGrid").innerHTML=content.map((v,i)=>
`<div class="summary-item"><small>${escapeHTML(labels[i])}</small><div>${escapeHTML(v)}</div></div>`
).join("");
$("result").classList.remove("hidden");
$("result").scrollIntoView({behavior:"smooth"});
}
groups.forEach(key=>{
$(key+"Add").addEventListener("click",()=>addCustom(key));
$(key+"CustomInput").addEventListener("keydown",e=>{
if(e.key==="Enter"){e.preventDefault();addCustom(key)}
});
});
$("priorityAdd").addEventListener("click",()=>{
const value=$("priorityInput").value.trim();
if(!value||state.priorities.length>=5)return;
state.priorities.push({text:value,level:1});
$("priorityInput").value="";
renderPriorities();updateProgress();save(false);
});
$("priorityInput").addEventListener("keydown",e=>{
if(e.key==="Enter"){e.preventDefault();$("priorityAdd").click()}
});
$("language").addEventListener("change",()=>{
state.lang=$("language").value;
localStorage.setItem("startingToolkitLanguage",state.lang);
localStorage.setItem("startingToolkitLang",state.lang);
render();save(false);
});
$("saveBtn").addEventListener("click",()=>save(true));
$("summaryBtn").addEventListener("click",showSummary);
$("editBtn").addEventListener("click",()=>{
$("result").classList.add("hidden");
window.scrollTo({top:0,behavior:"smooth"});
});
$("continueBtn").addEventListener("click",()=>{
save(false);
window.location.href="my-numbers.html";
});
state.lang=localStorage.getItem(LANG)||localStorage.getItem("startingToolkitLang")||"pt";
load();render();
</script>
</body>
</html>
