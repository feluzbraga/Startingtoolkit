
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Toolkit | My Market</title>
<style>
:root{--navy:#19283d;--purple:#6c63ff;--soft:#f0efff;--bg:#f6f7fb;--muted:#667085;--line:#e4e7ec;--green:#23966b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--navy);line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1080px;margin:auto;padding:24px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{font-weight:800;letter-spacing:2px;font-size:14px;color:inherit;text-decoration:none}
.top-right{display:flex;align-items:center;gap:12px}
.lang{border:1px solid var(--line);background:white;border-radius:10px;padding:9px}
.home{font-size:13px;color:var(--purple);text-decoration:none}
.hero{background:var(--navy);color:white;border-radius:22px;padding:28px 30px;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;opacity:.8}
.hero h1{font-size:30px;margin:8px 0}
.hero p{max-width:740px;margin:0;opacity:.88;font-size:15px}
.progress{margin-top:22px}
.progress-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.bar{height:8px;background:#ffffff30;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#b8e986;transition:width .2s}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:17px}
.section-title{font-size:20px;margin:0 0 6px}
.section-help{color:var(--muted);font-size:14px;margin:0 0 20px}
.q{margin:22px 0}
.q>label,.mini{display:block;font-weight:700;margin-bottom:8px}
.help{font-size:13px;color:var(--muted);margin:-2px 0 10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.opt{border:1px solid var(--line);background:white;border-radius:12px;padding:12px;text-align:left;color:var(--navy);min-height:44px}
.opt:hover{border-color:#aaa5ff}
.opt.selected{border-color:var(--purple);background:var(--soft);font-weight:700;color:#5148d9;box-shadow:0 0 0 1px var(--purple)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:white;color:var(--navy);outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6c63ff18}
.subgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.note{background:#f0f3f8;border:1px solid #dce4ee;border-radius:12px;padding:13px;color:#475467;font-size:13px;margin-top:12px}
.competitor{border:1px solid var(--line);border-radius:14px;padding:17px;margin:13px 0}
.competitor h3{font-size:15px;margin:0 0 13px}
.competitor-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.competitor label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.position-wrap{overflow:hidden;border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:15px}
.map{height:310px;position:relative;margin:25px 32px 35px 45px;border-left:2px solid #98a2b3;border-bottom:2px solid #98a2b3;background:linear-gradient(to right,transparent 49.8%,#e8eaf0 50%,transparent 50.2%),linear-gradient(to bottom,transparent 49.8%,#e8eaf0 50%,transparent 50.2%)}
.map:before{content:"";position:absolute;left:0;right:0;top:0;border-top:1px dashed #e8eaf0}
.map:after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed #e8eaf0}
.axis-y{position:absolute;left:-47px;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:11px;color:var(--muted);white-space:nowrap}
.axis-x{position:absolute;bottom:-27px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.map-label{position:absolute;font-size:10px;color:var(--muted)}
.map-label.top{top:-20px;left:0}
.map-label.bottom{bottom:-20px;left:0}
.map-label.left{left:0;bottom:-39px}
.map-label.right{right:0;bottom:-39px}
.dot{position:absolute;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;border:2px solid white;background:#8b93a5;box-shadow:0 1px 5px #0003}
.dot.you{background:var(--green);width:21px;height:21px}
.map-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#8b93a5}
.legend-dot.you{background:var(--green)}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.btn{border:0;border-radius:11px;padding:13px 18px;font-weight:700}
.primary{background:var(--purple);color:white}
.secondary{background:white;color:var(--navy);border:1px solid var(--line)}
.save{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.summary-item{border:1px solid var(--line);border-radius:13px;padding:14px;overflow-wrap:anywhere}
.summary-item small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.summary-item div{font-size:14px;white-space:pre-wrap}
.hidden{display:none!important}
@media(max-width:700px){
.app{padding:15px 12px 40px}.hero{padding:23px 19px}.hero h1{font-size:25px}
.card{padding:19px}.opts,.subgrid,.summary-grid{grid-template-columns:1fr}
.competitor-grid{grid-template-columns:1fr}
.actions{flex-direction:column}.btn{width:100%}
.map{height:260px;margin-left:42px;margin-right:18px}
}
</style>
</head>

<div class="q">

<div class="q">

<section class="card">

<div class="opts" id="opportunitiesOpts"></div>
</div>
<div class="q">

<div class="opts" id="differentiatorsOpts"></div>
</div>
<div class="q">

<div class="opts" id="validationOpts"></div>
</div>
</section>

<section class="card">

<span class="map-label bottom" id="mapBottom"></span>
<span class="map-label left" id="mapLeft"></span>
<span class="map-label right" id="mapRight"></span>
</div>
<div class="map-legend">
<span><i class="legend-dot"></i><span id="competitorLegend"></span></span>
<span><i class="legend-dot you"></i><span id="youLegend"></span></span>
</div>
<div class="note" id="mapNote"></div>
</div>
</section>

<section class="card">
<h2 class="section-title" id="summaryTitle"></h2>
<p class="section-help" id="summaryHelp"></p>
<div class="summary-grid" id="summaryGrid"></div>
<div class="actions">
<button class="btn secondary" id="saveBtn" type="button"></button>
<button class="btn primary" id="summaryBtn" type="button"></button>
</div>
<div class="save" id="saveStatus" aria-live="polite"></div>
</section>

<section class="card hidden" id="result">
<h2 class="section-title" id="resultTitle"></h2>
<p class="section-help" id="resultHelp"></p>
<div class="summary-grid" id="resultGrid"></div>
<div class="actions">
<button class="btn secondary" id="editBtn" type="button"></button>
<button class="btn primary" id="continueBtn" type="button"></button>
</div>
</section>

</div>

function values(key){return Array.isArray(state[key])?state[key]:[]}
function single(key){return state[key]===""?"":Number(state[key])}
function selectedLabels(key,options){
return values(key).map(i=>options[i]).filter(Boolean)
}
function renderOptions(id,options,key,multiple=true){
const el=$(id);el.innerHTML="";
options.forEach((option,index)=>{
const b=document.createElement("button");
b.type="button";b.className="opt";b.textContent=option;b.dataset.index=index;
b.addEventListener("click",()=>{
if(multiple){
state[key]=values(key).includes(index)?values(key).filter(x=>x!==index):[...values(key),index];
}else{state[key]=String(index)}
renderOptions(id,options,key,multiple);
updateProgress();save(false);
});
b.classList.toggle("selected",values(key).map(String).includes(String(index)));
el.appendChild(b);
});
}
function renderCompetitors(){
const d=D[state.lang];const root=$("competitorCards");root.innerHTML="";
state.competitors.forEach((item,index)=>{
const card=document.createElement("div");card.className="competitor";
const title=document.createElement("h3");title.textContent=d.competitor+" "+(index+1);
const grid=document.createElement("div");grid.className="competitor-grid";
const fields=[
["name",d.competitorName,"text",""],
["price",d.price,"select",d.priceOptions],
["quality",d.quality,"select",d.qualityOptions]
];
fields.forEach(([key,label,type,options])=>{
const wrap=document.createElement("div");
const lab=document.createElement("label");lab.textContent=label;wrap.appendChild(lab);
let field;
if(type==="text"){
field=document.createElement("input");field.type="text";field.value=item[key]||"";
field.addEventListener("input",()=>{item[key]=field.value;save(false);updateProgress();});
}else{
field=document.createElement("select");
const empty=document.createElement("option");empty.value="";empty.textContent=d.notSet;field.appendChild(empty);
options.forEach((v,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=v;field.appendChild(o)});
field.value=item[key]??"";
field.addEventListener("change",()=>{item[key]=field.value;save(false);renderMap();updateProgress();});
}
wrap.appendChild(field);grid.appendChild(wrap);
});
card.append(title,grid);root.appendChild(card);
});
}
function renderPosition(){
const d=D[state.lang];const root=$("positionFields");root.innerHTML="";
d.dimensions.forEach((dimension,index)=>{
const wrap=document.createElement("div");wrap.className="q";
const label=document.createElement("label");label.className="mini";label.textContent=dimension;
const select=document.createElement("select");
const empty=document.createElement("option");empty.value="";empty.textContent=d.notSet;select.appendChild(empty);
d.levels.forEach((level,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=level;select.appendChild(o)});
const key=["price","quality","service","specialization","convenience","experience"][index];
select.value=state.position[key]??"";
select.addEventListener("change",()=>{state.position[key]=select.value;save(false);renderMap();updateProgress();});
wrap.append(label,select);root.appendChild(wrap);
});
}
function renderMap(){
const d=D[state.lang];const map=$("map");
map.querySelectorAll(".dot").forEach(dot=>dot.remove());
state.competitors.forEach((c,i)=>{
if(c.price===""||c.quality==="")return;
const dot=document.createElement("span");dot.className="dot";
dot.title=c.name||d.competitor+" "+(i+1);
dot.style.left=(Number(c.price)*50+25)+"%";
dot.style.top=(100-(Number(c.quality)*50+25))+"%";
map.appendChild(dot);
});
if(state.position.price!==""&&state.position.quality!==""&&Number(state.position.price)<3&&Number(state.position.quality)<3){
const p=Number(state.position.price),q=Number(state.position.quality);
if(p<3&&q<3){
const dot=document.createElement("span");dot.className="dot you";dot.title=d.youLegend;
dot.style.left=(p*50+25)+"%";
dot.style.top=(100-(q*50+25))+"%";
map.appendChild(dot);
}
}
}
function render(){
const d=D[state.lang];document.documentElement.lang=state.lang==="pt"?"pt-BR":state.lang;
const text={
eyebrow:"eyebrow",title:"title",lead:"lead",progressLabel:"progress",homeLink:"home",
regionTitle:"regionTitle",regionHelp:"regionHelp",regionQ:"regionQ",
needsTitle:"needsTitle",needsHelp:"needsHelp",typesTitle:"typesTitle",typesHelp:"typesHelp",
competitionTitle:"competitionTitle",competitionHelp:"competitionHelp",
strengthsQ:"strengthsQ",weaknessesQ:"weaknessesQ",
competitorsTitle:"competitorsTitle",competitorsHelp:"competitorsHelp",
demandTitle:"demandTitle",demandHelp:"demandHelp",sourcesQ:"sourcesQ",signalsQ:"signalsQ",
opportunityTitle:"opportunityTitle",opportunityHelp:"opportunityHelp",
opportunitiesQ:"opportunitiesQ",differentiatorsQ:"differentiatorsQ",validationQ:"validationQ",
positionTitle:"positionTitle",positionHelp:"positionHelp",mapTitle:"mapTitle",
axisY:"axisY",axisX:"axisX",mapTop:"mapTop",mapBottom:"mapBottom",
mapLeft:"mapLeft",mapRight:"mapRight",competitorLegend:"competitorLegend",
youLegend:"youLegend",mapNote:"mapNote",summaryTitle:"summaryTitle",summaryHelp:"summaryHelp",
saveBtn:"save",summaryBtn:"summary",resultTitle:"resultTitle",resultHelp:"resultHelp",
editBtn:"edit",continueBtn:"continue"
};
Object.entries(text).forEach(([id,key])=>$(id).textContent=d[key]);
$("regionDetail").placeholder=d.regionDetail;
$("language").value=state.lang;
renderOptions("regionOpts",d.regions,"region",false);
renderOptions("needsOpts",d.needs,"needs");
renderOptions("typesOpts",d.types,"competitorTypes");
renderOptions("strengthsOpts",d.strengths,"strengths");
renderOptions("weaknessesOpts",d.weaknesses,"weaknesses");
renderOptions("sourcesOpts",d.sources,"sources");
renderOptions("signalsOpts",d.signals,"signals");
renderOptions("opportunitiesOpts",d.opportunities,"opportunities");
renderOptions("differentiatorsOpts",d.differentiators,"differentiators");
renderOptions("validationOpts",d.validation,"validation");
renderCompetitors();renderPosition();renderMap();updateProgress();
}
function collect(){state.regionDetail=$("regionDetail").value}
function save(show=true){
collect();
const d=D[state.lang];
const data={
...state,
marketRegion:state.region===""?"":d.regions[Number(state.region)],
marketNeeds:selectedLabels("needs",d.needs),
competitorTypes:selectedLabels("competitorTypes",d.types),
competitorStrengths:selectedLabels("strengths",d.strengths),
competitorWeaknesses:selectedLabels("weaknesses",d.weaknesses),
demandSources:selectedLabels("sources",d.sources),
demandSignals:selectedLabels("signals",d.signals),
marketOpportunities:selectedLabels("opportunities",d.opportunities),
marketDifferentiators:selectedLabels("differentiators",d.differentiators),
validationMethods:selectedLabels("validation",d.validation),
updatedAt:new Date().toISOString()
};
localStorage.setItem(KEY,JSON.stringify(data));
if(show)$("saveStatus").textContent=d.saved;
}
function load(){
try{
const data=JSON.parse(localStorage.getItem(KEY)||"null");
if(data){
Object.keys(state).forEach(k=>{if(data[k]!==undefined)state[k]=data[k]});
if(!Array.isArray(state.competitors))state.competitors=state.competitors;
["needs","competitorTypes","strengths","weaknesses","sources","signals","opportunities","differentiators","validation"].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
if(!state.position||typeof state.position!=="object")state.position={price:"",quality:"",service:"",specialization:"",convenience:"",experience:""};
}
}catch(e){}
$("regionDetail").value=state.regionDetail||"";
}
function updateProgress(){
collect();
const checks=[
state.region!=="",state.regionDetail,values("needs").length,values("competitorTypes").length,
values("strengths").length,values("weaknesses").length,
state.competitors.some(c=>c.name.trim()),
values("sources").length,values("signals").length,
values("opportunities").length,values("differentiators").length,
values("validation").length,
Object.values(state.position).some(v=>v!=="")
];
const pct=Math.round(checks.filter(Boolean).length/checks.length*100);
$("progressPct").textContent=pct+"%";$("bar").style.width=pct+"%";
}
function summaryData(){
const d=D[state.lang];
const comp=state.competitors.filter(c=>c.name.trim()).map(c=>{
const p=c.price===""?d.notSet:d.priceOptions[Number(c.price)];
const q=c.quality===""?d.notSet:d.qualityOptions[Number(c.quality)];
return c.name+" ("+d.price+": "+p+"; "+d.quality+": "+q+")";
}).join("\n");
const pos=d.dimensions.map((label,i)=>{
const key=["price","quality","service","specialization","convenience","experience"][i];
return label+": "+(state.position[key]===""?d.notSet:d.levels[Number(state.position[key])]);
}).join("\n");
return [
state.region===""?d.noData:d.regions[Number(state.region)],
state.regionDetail,
selectedLabels("needs",d.needs).join(", "),
selectedLabels("competitorTypes",d.types).join(", "),
selectedLabels("strengths",d.strengths).join(", "),
selectedLabels("weaknesses",d.weaknesses).join(", "),
comp,
selectedLabels("sources",d.sources).join(", "),
selectedLabels("signals",d.signals).join(", "),
selectedLabels("opportunities",d.opportunities).join(", "),
selectedLabels("differentiators",d.differentiators).join(", "),
selectedLabels("validation",d.validation).join(", "),
pos
];
}
function showSummary(){
save(false);
const d=D[state.lang];const values=summaryData();
$("resultGrid").innerHTML=values.map((v,i)=>
`<div class="summary-item"><small>${escapeHTML(d.labels[i])}</small><div>${escapeHTML(v||d.noData)}</div></div>`
).join("");
$("result").classList.remove("hidden");
$("result").scrollIntoView({behavior:"smooth"});
}
function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
$("regionDetail").addEventListener("input",()=>{state.regionDetail=$("regionDetail").value;save(false);updateProgress()});
$("language").addEventListener("change",()=>{
state.lang=$("language").value;
localStorage.setItem("startingToolkitLanguage",state.lang);
localStorage.setItem("startingToolkitLang",state.lang);
render();save(false);
});
$("saveBtn").addEventListener("click",()=>save(true));
$("summaryBtn").addEventListener("click",showSummary);
$("editBtn").addEventListener("click",()=>{$("result").classList.add("hidden");window.scrollTo({top:0,behavior:"smooth"})});
$("continueBtn").addEventListener("click",()=>{save(false);window.location.href="my-swot.html"});
state.lang=localStorage.getItem(LANG)||localStorage.getItem("startingToolkitLang")||"pt";
load();render();
</script>
<script src="toolkit-navigation.js"></script>
</body>
</html>
