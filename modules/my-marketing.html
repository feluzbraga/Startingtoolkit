<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starting Toolkit — My Marketing</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#17202a;--muted:#68717c;--line:#dfe4ea;--brand:#1f8f73;--brand2:#e7f5f0;--dark:#15232d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink);line-height:1.45}.wrap{max-width:1080px;margin:auto;padding:28px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800;letter-spacing:.08em;font-size:14px}.lang button{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:8px;cursor:pointer}.lang button.active{background:var(--dark);color:#fff}
h1{font-size:34px;margin:0 0 8px}.lead{color:var(--muted);max-width:760px;margin:0 0 24px}.progress{background:#e7eaee;height:8px;border-radius:99px;overflow:hidden;margin:16px 0 30px}.progress i{display:block;height:100%;background:var(--brand);width:0}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 5px 20px rgba(20,30,40,.035)}h2{font-size:20px;margin:0 0 6px}.hint{color:var(--muted);font-size:14px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice input{position:absolute;opacity:0}.choice label{display:block;border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;background:#fff}.choice input:checked+label{border-color:var(--brand);background:var(--brand2);box-shadow:inset 0 0 0 1px var(--brand)}
.snapshot{background:var(--dark);color:#fff;border-radius:18px;padding:24px}.snapshot h2{color:#fff}.snapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.metric{background:rgba(255,255,255,.08);border-radius:12px;padding:13px}.metric b{display:block;font-size:14px}.metric span{font-size:12px;color:#cdd5da}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{background:#f0f2f5;color:var(--ink);border-radius:99px;padding:6px 10px;font-size:13px}.notice{background:#f7f8f9;border-radius:12px;padding:13px;font-size:13px;margin-top:15px}.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.planbox{background:rgba(255,255,255,.08);border-radius:12px;padding:14px;font-size:13px}.planbox h3{margin:0 0 6px}.btn{border:0;background:var(--brand);color:#fff;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}.actions{display:flex;justify-content:flex-end;margin-top:18px}
@media(max-width:720px){.grid,.snapgrid,.plan{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:20px 13px 45px}section{padding:18px}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">STARTING TOOLKIT</div><div class="lang"><button data-lang="pt">PT</button><button data-lang="en">EN</button><button data-lang="es">ES</button></div></div>
<h1 id="title"></h1><p class="lead" id="lead"></p><div class="progress"><i id="bar"></i></div><div id="app"></div></div>
<script>
const D={
pt:{title:"MY MARKETING",lead:"Transforme as decisões dos módulos anteriores em um plano de marketing simples, realista e acionável.",
s:[["1. O que você quer alcançar?","Qual é o principal objetivo do seu marketing?",["Tornar a marca conhecida","Atrair novos clientes","Gerar leads e contatos","Gerar vendas","Lançar o negócio","Aumentar recompra e fidelização","Atrair clientes para a loja/local","Testar uma nova oferta"],0],
["2. Sua oferta","O que você quer que o cliente perceba primeiro?",["Preço/condição atrativa","Qualidade superior","Especialização","Atendimento","Conveniência","Experiência","Rapidez","Personalização","Variedade","Inovação"],1],
["3. Canais","Onde você pretende encontrar seus clientes?",["Instagram","Google Search","Google Maps / Perfil da Empresa","WhatsApp","TikTok","Facebook","Email","Influenciadores","Marketplaces","Parcerias","Indicações","Eventos","Site / Landing page","Loja física / fachada","Flyers / panfletos","Outdoor","Rádio","Jornal / revista local","Feiras / networking","Ações em condomínios","Materiais impressos"],1],
["4. Como o cliente vai encontrar você?","Escolha as principais portas de entrada.",["Busca no Google","Google Maps","Redes sociais","Anúncios pagos","Indicação de clientes","Parcerias","Passagem em frente ao negócio","Marketplace","Eventos","Conteúdo / educação"],1],
["5. Sua estratégia de conteúdo","Que tipo de conteúdo pode ajudar seu cliente a confiar e decidir?",["Educação / dicas","Demonstração do produto ou serviço","Antes e depois / resultados","Depoimentos e avaliações","Bastidores","Perguntas frequentes","Comparações","Ofertas e campanhas","Cases / histórias de clientes","Conteúdo institucional"],1],
["6. Investimento em marketing","Quanto pretende investir por mês inicialmente?",["Até R$ 300","R$ 300 a R$ 1.000","R$ 1.000 a R$ 3.000","R$ 3.000 a R$ 5.000","R$ 5.000 a R$ 10.000","Mais de R$ 10.000","Ainda não sei"],0],
["7. Seu lançamento","Como pretende começar a divulgação?",["Começar organicamente e testar","Fazer uma campanha de lançamento","Pré-venda / lista de interessados","Evento de inauguração","Campanha com oferta inicial","Parcerias antes da abertura","Ainda não decidi"],0],
["8. Frequência","Qual ritmo é realista para você?",["1–2 ações por semana","3–4 ações por semana","5+ ações por semana","Campanhas pontuais","Ainda não sei"],0],
["9. Plano de 30 dias","Escolha as prioridades para o primeiro mês.",["Definir posicionamento e mensagem","Criar presença digital básica","Configurar Google Business Profile","Organizar WhatsApp Business","Produzir conteúdo inicial","Criar oferta de lançamento","Rodar primeiros anúncios","Buscar parcerias","Pedir primeiras avaliações","Medir resultados"],1]],
snap:"MARKETING SNAPSHOT",labels:["Objetivo principal","Diferencial percebido","Orçamento mensal","Canais","Portas de entrada","Estratégia de lançamento"],priority:"Prioridades dos primeiros 30 dias",next:"Suas próximas prioridades",save:"Salvar e continuar para MY LAUNCH →",empty:"Ainda não definido",note:"Dica: você não precisa estar em todos os canais. Para começar, escolha os canais mais adequados ao seu público e execute-os bem.",
nexts:["Defina uma mensagem clara para sua oferta.","Escolha poucos canais e comece a testar.","Crie uma primeira oferta ou ação de aquisição.","Defina como você vai medir os primeiros resultados."]},
en:{title:"MY MARKETING",lead:"Turn the decisions from the previous modules into a simple, realistic and actionable marketing plan.",s:[["1. What do you want to achieve?","What is the main goal of your marketing?",["Build brand awareness","Attract new customers","Generate leads and contacts","Generate sales","Launch the business","Increase repeat purchases and loyalty","Drive customers to your location","Test a new offer"],0],["2. Your offer","What should customers notice first?",["Attractive price/terms","Superior quality","Specialization","Service","Convenience","Experience","Speed","Personalization","Variety","Innovation"],1],["3. Channels","Where do you plan to reach your customers?",["Instagram","Google Search","Google Maps / Business Profile","WhatsApp","TikTok","Facebook","Email","Influencers","Marketplaces","Partnerships","Referrals","Events","Website / Landing page","Physical store / storefront","Flyers","Outdoor advertising","Radio","Local newspaper / magazine","Fairs / networking","Condominium actions","Printed materials"],1],["4. How will customers find you?","Choose your main entry points.",["Google Search","Google Maps","Social media","Paid ads","Customer referrals","Partnerships","Passing by your business","Marketplace","Events","Content / education"],1],["5. Content strategy","What type of content can help customers trust you and decide?",["Education / tips","Product or service demonstration","Before & after / results","Testimonials and reviews","Behind the scenes","FAQs","Comparisons","Offers and campaigns","Customer stories / cases","Institutional content"],1],["6. Marketing investment","How much do you initially plan to invest per month?",["Up to R$ 300","R$ 300 to R$ 1,000","R$ 1,000 to R$ 3,000","R$ 3,000 to R$ 5,000","R$ 5,000 to R$ 10,000","More than R$ 10,000","Not sure yet"],0],["7. Your launch","How do you plan to start promoting the business?",["Start organically and test","Run a launch campaign","Pre-sale / interested list","Opening event","Initial offer campaign","Partnerships before opening","Not decided yet"],0],["8. Frequency","What pace is realistic for you?",["1–2 actions per week","3–4 actions per week","5+ actions per week","Occasional campaigns","Not sure yet"],0],["9. 30-day plan","Choose your priorities for the first month.",["Define positioning and message","Build basic digital presence","Set up Google Business Profile","Organize WhatsApp Business","Create initial content","Create launch offer","Run first ads","Build partnerships","Get first reviews","Measure results"],1]],snap:"MARKETING SNAPSHOT",labels:["Main objective","Perceived differentiator","Monthly budget","Channels","Entry points","Launch strategy"],priority:"First 30-day priorities",next:"Your next priorities",save:"Save and continue to MY LAUNCH →",empty:"Not defined yet",note:"Tip: you don't need to be everywhere. Start by choosing the channels that best fit your audience and execute them well.",nexts:["Define a clear message for your offer.","Choose a few channels and start testing.","Create a first acquisition offer or action.","Define how you will measure the first results."]},
es:{title:"MY MARKETING",lead:"Transforma las decisiones de los módulos anteriores en un plan de marketing simple, realista y accionable.",s:[["1. ¿Qué quieres conseguir?","¿Cuál es el principal objetivo de tu marketing?",["Dar a conocer la marca","Atraer nuevos clientes","Generar leads y contactos","Generar ventas","Lanzar el negocio","Aumentar la recompra y fidelización","Atraer clientes al local","Probar una nueva oferta"],0],["2. Tu oferta","¿Qué quieres que el cliente perciba primero?",["Precio/condición atractiva","Calidad superior","Especialización","Atención","Comodidad","Experiencia","Rapidez","Personalización","Variedad","Innovación"],1],["3. Canales","¿Dónde piensas encontrar a tus clientes?",["Instagram","Google Search","Google Maps / Perfil de Empresa","WhatsApp","TikTok","Facebook","Email","Influencers","Marketplaces","Alianzas","Recomendaciones","Eventos","Web / Landing page","Tienda física / fachada","Flyers","Publicidad exterior","Radio","Periódico / revista local","Ferias / networking","Acciones en comunidades","Materiales impresos"],1],["4. ¿Cómo te encontrarán?","Elige tus principales puertas de entrada.",["Búsqueda en Google","Google Maps","Redes sociales","Anuncios pagados","Recomendaciones de clientes","Alianzas","Paso frente al negocio","Marketplace","Eventos","Contenido / educación"],1],["5. Estrategia de contenido","¿Qué contenido puede ayudar al cliente a confiar y decidir?",["Educación / consejos","Demostración del producto o servicio","Antes y después / resultados","Testimonios y reseñas","Detrás de cámaras","Preguntas frecuentes","Comparaciones","Ofertas y campañas","Casos / historias de clientes","Contenido institucional"],1],["6. Inversión en marketing","¿Cuánto piensas invertir inicialmente al mes?",["Hasta R$ 300","R$ 300 a R$ 1.000","R$ 1.000 a R$ 3.000","R$ 3.000 a R$ 5.000","R$ 5.000 a R$ 10.000","Más de R$ 10.000","Aún no lo sé"],0],["7. Tu lanzamiento","¿Cómo piensas empezar a divulgar el negocio?",["Empezar orgánicamente y probar","Hacer una campaña de lanzamiento","Preventa / lista de interesados","Evento de apertura","Campaña con oferta inicial","Alianzas antes de abrir","Aún no lo he decidido"],0],["8. Frecuencia","¿Qué ritmo es realista para ti?",["1–2 acciones por semana","3–4 acciones por semana","5+ acciones por semana","Campañas puntuales","Aún no lo sé"],0],["9. Plan de 30 días","Elige las prioridades para el primer mes.",["Definir posicionamiento y mensaje","Crear presencia digital básica","Configurar Google Business Profile","Organizar WhatsApp Business","Crear contenido inicial","Crear oferta de lanzamiento","Probar primeros anuncios","Buscar alianzas","Conseguir primeras reseñas","Medir resultados"],1]],snap:"MARKETING SNAPSHOT",labels:["Objetivo principal","Diferencial percibido","Presupuesto mensual","Canales","Puertas de entrada","Estrategia de lanzamiento"],priority:"Prioridades de los primeros 30 días",next:"Tus próximas prioridades",save:"Guardar y continuar a MY LAUNCH →",empty:"Aún no definido",note:"Consejo: no necesitas estar en todos los canales. Para empezar, elige los que mejor se adapten a tu público y ejecútalos bien.",nexts:["Define un mensaje claro para tu oferta.","Elige pocos canales y empieza a probar.","Crea una primera oferta o acción de captación.","Define cómo medirás los primeros resultados."]}};
let lang=(navigator.language||"").toLowerCase().startsWith("en")?"en":(navigator.language||"").toLowerCase().startsWith("es")?"es":"pt";
let state=JSON.parse(localStorage.getItem("startingToolkitMarketingV1")||"{}");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function vals(i){return state["g"+i]||[]}
function render(){
let d=D[lang];document.documentElement.lang=lang;document.getElementById("title").textContent=d.title;document.getElementById("lead").textContent=d.lead;
let app="";
d.s.forEach((x,n)=>{let id="g"+(n+1),multi=x[3]===1;app+=`<section><h2>${x[0]}</h2><p class="hint">${x[1]}</p><div class="grid">${x[2].map((o,i)=>`<div class="choice"><input ${multi?"type=checkbox":"type=radio"} name="${id}" id="${id}_${i}" value="${esc(o)}"><label for="${id}_${i}">${esc(o)}</label></div>`).join("")}</div></section>`});
app+=`<section class="snapshot"><h2>${d.snap}</h2><div class="snapgrid">${d.labels.map((x,i)=>`<div class="metric"><b>${x}</b><span id="m${i}">${d.empty}</span></div>`).join("")}</div><h3>${d.priority}</h3><div class="tags" id="tags"></div><div class="notice">${d.note}</div><h3>${d.next}</h3><div class="plan">${d.nexts.map((x,i)=>`<div class="planbox"><h3>${i+1}</h3>${esc(x)}</div>`).join("")}</div><div class="actions"><button class="btn" onclick="save()">${d.save}</button></div></section>`;
document.getElementById("app").innerHTML=app;
for(let i=1;i<=9;i++)vals(i).forEach(v=>{let el=[...document.querySelectorAll("#g"+i+" input")].find(x=>x.value===v);if(el)el.checked=true});update();
}
function save(){for(let i=1;i<=9;i++)state["g"+i]=[...document.querySelectorAll("#g"+i+" input:checked")].map(x=>x.value);localStorage.setItem("startingToolkitMarketingV1",JSON.stringify(state));update();window.location.href="my-launch.html"}
function update(){let d=D[lang],all=[];for(let i=1;i<=9;i++)all.push(vals(i));document.getElementById("bar").style.width=(all.filter(x=>x.length).length/9*100)+"%";for(let i=0;i<6;i++)document.getElementById("m"+i).textContent=all[[0,1,5,2,3,6][i]].slice(0,i===3||i===4?3:2).join(" • ")||d.empty;document.getElementById("tags").innerHTML=(all[8].map(x=>`<span class="tag">${esc(x)}</span>`).join("")||`<span class="tag">${d.empty}</span>`)}
document.addEventListener("change",e=>{if(e.target.matches("input"))save()});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("active",x.dataset.lang===lang));render()});
document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("active",x.dataset.lang===lang));render();
</script></body></html>
