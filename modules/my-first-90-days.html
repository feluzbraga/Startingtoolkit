
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Toolkit | My First 90 Days</title>
<style>
:root{--ink:#202b38;--muted:#687586;--line:#e1e7ec;--soft:#f4f7f8;--brand:#315c72;--accent:#d9a441;--green:#24734c}
*{box-sizing:border-box}
body{margin:0;background:#f2f5f7;color:var(--ink);font:15px/1.5 Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:25px 18px 55px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}
.logo{font-weight:800;letter-spacing:.08em;color:var(--brand);font-size:13px}
select,input,textarea,button{font:inherit}
.lang{border:1px solid var(--line);border-radius:9px;padding:8px;background:white;color:var(--ink)}
.hero{background:linear-gradient(135deg,#244b61,#3c7182);color:white;padding:28px;border-radius:20px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.8}
h1{font-size:clamp(28px,5vw,38px);margin:7px 0}
.hero p{color:#e5edf1;max-width:720px;margin:0}
.progress{height:7px;background:#dce4e9;border-radius:20px;overflow:hidden;margin-top:19px}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #20304008}
.card h2{font-size:20px;margin:0 0 5px}
.card h3{font-size:16px;margin:20px 0 8px}
.intro{color:var(--muted);margin:0 0 17px;font-size:14px}
.tag{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.08em;text-transform:uppercase}
.phasehead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.phaseicon{width:42px;height:42px;border-radius:12px;background:#eaf1f4;display:grid;place-items:center;font-weight:800;color:var(--brand)}
.tasks{display:grid;gap:9px}
.task{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px}
.task label{font-size:14px}
.task select{width:100%;border:1px solid #d4dce3;border-radius:8px;padding:8px;background:#fff;color:var(--ink)}
.custom{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.custom input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:9px;padding:10px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:white;font-weight:700;cursor:pointer}
.btn.secondary{background:#edf2f5;color:var(--brand);border:1px solid #d7e0e6}
.btn.gold{background:var(--accent);color:#29251d}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field label{display:block;font-weight:650;font-size:13px;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid #d4dce3;border-radius:9px;padding:10px 11px;color:var(--ink);background:white}
.field textarea{min-height:90px;resize:vertical}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--soft);padding:14px;border-radius:12px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi strong{font-size:20px;display:block;margin-top:4px;overflow-wrap:anywhere}
.note{background:#f7f8fa;color:#354453;border-left:3px solid var(--accent);padding:12px;border-radius:8px;font-size:13px;margin-top:15px}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.small{font-size:12px;color:var(--muted)}
@media(max-width:700px){
.task{grid-template-columns:1fr}
.grid{grid-template-columns:1fr}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:17px}
.hero{padding:23px 19px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="logo">STARTING TOOLKIT</div>
<select class="lang" id="language">
<option value="pt">Português</option>
<option value="en">English</option>
<option value="es">Español</option>
</select>
</div>

<header class="hero">
<div class="eyebrow" id="eyebrow"></div>
<h1>MY FIRST 90 DAYS</h1>
<p id="subtitle"></p>
<div class="progress"><span id="progressBar"></span></div>
</header>

<div id="phases"></div>

<section class="card">
<div class="tag" id="scoreTag"></div>
<h2 id="scoreTitle"></h2>
<p class="intro" id="scoreIntro"></p>
<div class="kpis">
<div class="kpi"><span id="k1label"></span><strong id="k1">0%</strong></div>
<div class="kpi"><span id="k2label"></span><strong id="k2">0</strong></div>
<div class="kpi"><span id="k3label"></span><strong id="k3">0</strong></div>
<div class="kpi"><span id="k4label"></span><strong id="k4">0</strong></div>
</div>
<div class="note" id="scoreNote"></div>
</section>

<section class="card">
<div class="tag" id="metricsTag"></div>
<h2 id="metricsTitle"></h2>
<p class="intro" id="metricsIntro"></p>
<div class="grid" id="metricsGrid"></div>
</section>

<section class="card">
<div class="tag" id="reflectionTag"></div>
<h2 id="reflectionTitle"></h2>
<p class="intro" id="reflectionIntro"></p>
<div class="field">
<label id="keepLabel" for="keep"></label>
<textarea id="keep"></textarea>
</div>
<div class="field" style="margin-top:14px">
<label id="changeLabel" for="change"></label>
<textarea id="change"></textarea>
</div>
<div class="field" style="margin-top:14px">
<label id="nextLabel" for="next"></label>
<textarea id="next"></textarea>
</div>
<div class="footer">
<button class="btn secondary" id="saveButton"></button>
<button class="btn gold" id="continueButton"></button>
</div>
<p class="small" id="saveStatus" aria-live="polite"></p>
</section>
</div>

let lang="pt";
let data={tasks:{},metrics:{},reflection:{}};
try{
const saved=JSON.parse(localStorage.getItem(KEY)||"null");
if(saved)data={...data,...saved,tasks:saved.tasks||{},metrics:saved.metrics||{},reflection:saved.reflection||{}};
}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
const d=T[lang];
document.documentElement.lang=lang==="pt"?"pt-BR":lang;
$("eyebrow").textContent=d.eyebrow;
$("subtitle").textContent=d.subtitle;
$("scoreTag").textContent=d.scoreTag;
$("scoreTitle").textContent=d.scoreTitle;
$("scoreIntro").textContent=d.scoreIntro;
$("k1label").textContent=d.progress;
$("k2label").textContent=d.done;
$("k3label").textContent=d.pending;
$("k4label").textContent=d.phasesDone;
$("scoreNote").textContent=d.scoreNote;
$("metricsTag").textContent=d.metricsTag;
$("metricsTitle").textContent=d.metricsTitle;
$("metricsIntro").textContent=d.metricsIntro;
$("reflectionTag").textContent=d.reflectionTag;
$("reflectionTitle").textContent=d.reflectionTitle;
$("reflectionIntro").textContent=d.reflectionIntro;
$("keepLabel").textContent=d.keep;
$("changeLabel").textContent=d.change;
$("nextLabel").textContent=d.next;
$("keep").placeholder=d.keepPlaceholder;
$("change").placeholder=d.changePlaceholder;
$("next").placeholder=d.nextPlaceholder;
$("saveButton").textContent=d.save;
$("continueButton").textContent=d.continue;

let phases="";
d.phases.forEach((phase,i)=>{
phases+=`<section class="card">
<div class="phasehead"><div class="phaseicon">${i+1}</div><div><div class="tag">${phase.name}</div><h2>${phase.title}</h2></div></div>
<p class="intro">${phase.intro}</p>
<div class="tasks">`;
phase.tasks.forEach((task,j)=>{
let id=i+"_"+j;
let value=Number(data.tasks[id]||0);
phases+=`<div class="task">
<label for="task_${id}">${esc(task)}</label>
<select id="task_${id}" data-task="${id}">
${d.status.map((s,k)=>`<option value="${k}" ${value===k?"selected":""}>${s}</option>`).join("")}
</select>
</div>`;
});
phases+=`</div></section>`;
});
$("phases").innerHTML=phases;

let metrics="";
d.metrics.forEach((m,i)=>{
metrics+=`<div class="field">
<label for="metric_${i}">${m[0]}</label>
<input type="number" min="0" step="0.01" id="metric_${i}" data-metric="${i}" value="${esc(data.metrics[i]??"")}" placeholder="${m[1]}">
</div>`;
});
$("metricsGrid").innerHTML=metrics;

$("keep").value=data.reflection.keep||"";
$("change").value=data.reflection.change||"";
$("next").value=data.reflection.next||"";
update();
}

function update(){
let total=0,done=0,phasesDone=0;
for(let i=0;i<3;i++){
let phaseTotal=0,phaseDone=0;
document.querySelectorAll(`[data-task^="${i}_"]`).forEach(el=>{
let v=Number(el.value);
if(v!==3){
total++;
phaseTotal++;
if(v===2){done++;phaseDone++;}
}
});
if(phaseTotal>0&&phaseDone===phaseTotal)phasesDone++;
}
let pending=total-done;
let percent=total?Math.round(done/total*100):0;
$("k1").textContent=percent+"%";
$("k2").textContent=done;
$("k3").textContent=pending;
$("k4").textContent=phasesDone+"/3";
$("progressBar").style.width=percent+"%";
$("scoreNote").textContent=T[lang].scoreNote;
save(false);
}

function save(show=true){
data.tasks=data.tasks||{};
document.querySelectorAll("[data-task]").forEach(el=>{
data.tasks[el.dataset.task]=Number(el.value);
});
data.metrics=data.metrics||{};
document.querySelectorAll("[data-metric]").forEach(el=>{
data.metrics[el.dataset.metric]=el.value;
});
data.reflection={
keep:$("keep").value,
change:$("change").value,
next:$("next").value
};
try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
if(show)$("saveStatus").textContent=T[lang].saved;
}

document.addEventListener("change",e=>{
if(e.target.matches("[data-task]"))update();
if(e.target.matches("[data-metric]"))save(false);
});

["keep","change","next"].forEach(id=>{
$(id).addEventListener("input",()=>save(false));
});

$("language").addEventListener("change",e=>{
save(false);
lang=e.target.value;
render();
});

$("saveButton").addEventListener("click",()=>save(true));

$("continueButton").addEventListener("click",()=>{
save(true);
window.location.href="your-final-plan.html";
});

render();
</script>
<script src="toolkit-navigation.js"></script>
<script>
// Starting Toolkit cloud sync. Local storage remains as an offline backup.
(() => {
  const STORAGE_KEY = "startingToolkit90Days";
  const MODULE_KEY = "90days";
  const status = document.getElementById("saveStatus");
  const messages = {
    pt: {saving:"Salvando na nuvem...", saved:"Salvo na nuvem.", local:"Salvo neste navegador. Faça login para sincronizar.", error:"Salvo neste dispositivo, mas houve um erro ao sincronizar."},
    en: {saving:"Saving to the cloud...", saved:"Saved to the cloud.", local:"Saved in this browser. Log in to sync.", error:"Saved on this device, but cloud sync failed."},
    es: {saving:"Guardando en la nube...", saved:"Guardado en la nube.", local:"Guardado en este navegador. Inicia sesión para sincronizar.", error:"Guardado en este dispositivo, pero no se pudo sincronizar."}
  };
  const lang = () => { try { return (localStorage.getItem("startingToolkitLanguage") || localStorage.getItem("startingToolkitLang") || "pt").slice(0,2); } catch (_) { return "pt"; } };
  const msg = k => (messages[lang()] || messages.pt)[k];
  let authenticated = false, timer = null, chain = Promise.resolve(), busy = false;
  async function post(data) {
    if (!authenticated) { if(status) status.textContent=msg("local"); return false; }
    if(status) status.textContent=msg("saving");
    try {
      const response=await fetch(`/api/modules/${MODULE_KEY}`,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({data})});
      const result=await response.json().catch(()=>({}));
      if(!response.ok || result.ok!==true || result.saved!==true) throw new Error(result.error || "Save failed");
      if(status) status.textContent=msg("saved");
      return true;
    } catch(e) { if(status) status.textContent=msg("error"); return false; }
  }
  function queue(data) {
    if(!authenticated || busy) return;
    clearTimeout(timer);
    timer=setTimeout(()=>{ chain=chain.then(()=>post(data)); },700);
  }
  async function init() {
    try {
      const authRes=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});
      if(!authRes.ok) { if(status) status.textContent=msg("local"); return; }
      const auth=await authRes.json();
      if(!auth.authenticated || !auth.businessPlanId) { if(status) status.textContent=msg("local"); return; }
      authenticated=true;
      const cloudRes=await fetch(`/api/modules/${MODULE_KEY}`,{credentials:"same-origin",cache:"no-store"});
      if(!cloudRes.ok) throw new Error("Cloud load failed");
      const cloud=await cloudRes.json();
      const local=localStorage.getItem(STORAGE_KEY);
      if(cloud.data) {
        const cloudText=JSON.stringify(cloud.data);
        if(local!==cloudText && !sessionStorage.getItem("stk_cloud_hydrated_"+MODULE_KEY)) {
          busy=true; localStorage.setItem(STORAGE_KEY,cloudText); sessionStorage.setItem("stk_cloud_hydrated_"+MODULE_KEY,"1"); location.reload(); return;
        }
        if(status) status.textContent=msg("saved");
      } else if(local) {
        let parsed; try { parsed=JSON.parse(local); } catch(_) { parsed=null; }
        if(parsed && typeof parsed==="object") await post(parsed);
      } else if(status) status.textContent=msg("saved");
      const original=Storage.prototype.setItem;
      Storage.prototype.setItem=function(k,v) {
        original.call(this,k,v);
        if(this===localStorage && k===STORAGE_KEY && authenticated && !busy) {
          try { queue(JSON.parse(v)); } catch(_) {}
        }
      };
    } catch(e) { if(status) status.textContent=msg("error"); }
  }
  init();
})();
