
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Toolkit | My Launch</title>
<style>
:root{--ink:#202b38;--muted:#687586;--line:#e1e7ec;--soft:#f4f7f8;--brand:#315c72;--accent:#d9a441;--green:#24734c}
*{box-sizing:border-box}
body{margin:0;background:#f2f5f7;color:var(--ink);font:15px/1.5 Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:25px 18px 55px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}
.logo{font-weight:800;letter-spacing:.08em;color:var(--brand);font-size:13px}
select,input,button{font:inherit}
.lang{border:1px solid var(--line);border-radius:9px;padding:8px;background:white;color:var(--ink)}
.hero{background:linear-gradient(135deg,#244b61,#3c7182);color:white;padding:28px;border-radius:20px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.8}
h1{font-size:clamp(28px,5vw,38px);margin:7px 0}
.hero p{color:#e5edf1;max-width:720px;margin:0}
.progress{height:7px;background:#dce4e9;border-radius:20px;overflow:hidden;margin-top:19px}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #20304008}
.card h2{font-size:20px;margin:0 0 5px}
.intro{color:var(--muted);margin:0 0 17px;font-size:14px}
.tag{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.08em;text-transform:uppercase}
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:minmax(0,1fr) 165px;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:11px}
.task label{font-size:14px}
.task select{width:100%;border:1px solid #d4dce3;border-radius:8px;padding:8px;background:#fff;color:var(--ink)}
.custom{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.custom input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:9px;padding:10px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:white;font-weight:700;cursor:pointer}
.btn.secondary{background:#edf2f5;color:var(--brand);border:1px solid #d7e0e6}
.btn.gold{background:var(--accent);color:#29251d}
.remove{border:0;background:#fbeeee;color:#963d3d;border-radius:7px;padding:5px 9px;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.metric{background:var(--soft);border-radius:12px;padding:15px}
.metric span{display:block;font-size:12px;color:var(--muted)}
.metric strong{display:block;font-size:22px;margin-top:4px}
.bar{height:10px;background:#e7ebef;border-radius:20px;overflow:hidden;margin:12px 0}
.bar span{height:100%;display:block;background:var(--green);width:0}
.status{font-weight:700;margin-top:10px}
.note{background:#f7f8fa;color:#354453;border-left:3px solid var(--accent);padding:12px;border-radius:8px;font-size:13px;margin-top:15px}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.small{font-size:12px;color:var(--muted)}
@media(max-width:650px){.task{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.card{padding:17px}.hero{padding:23px 19px}}
</style>
<link rel="stylesheet" href="toolkit-shell.css"><link rel="stylesheet" href="toolkit-shared-header.css">
</head>
<body>
<div class="wrap">
<div class="top">
<div class="logo">STARTING TOOLKIT</div>
<select class="lang" id="language">
<option value="pt">Português</option>
<option value="en">English</option>
<option value="es">Español</option>

</div>

<header class="hero">
<div class="eyebrow" id="eyebrow"></div>
<h1>MY LAUNCH</h1>
<p id="subtitle"></p>
<div class="progress"><span id="progressBar"></span></div>
</header>

<div id="sections"></div>

<section class="card">
<div class="tag" id="summaryTag"></div>
<h2 id="summaryTitle"></h2>
<p class="intro" id="summaryIntro"></p>
<div class="summary">
<div class="metric"><span id="m1label"></span><strong id="m1">0%</strong></div>
<div class="metric"><span id="m2label"></span><strong id="m2">0</strong></div>
<div class="metric"><span id="m3label"></span><strong id="m3">0</strong></div>
</div>
<div class="bar"><span id="summaryBar"></span></div>
<div class="status" id="readiness"></div>
<div class="note" id="advice"></div>
<div class="footer">
<button class="btn secondary" id="saveButton"></button>
<button class="btn gold" id="continueButton"></button>
</div>
<p class="small" id="saveStatus" aria-live="polite"></p>
</section>
</div>

<script>
const KEY="startingToolkitLaunchV1";

const T={

{title:"2. Estrutura pronta para receber clientes",intro:"Confira os recursos necessários para atender e vender.",items:["Perfil da Empresa no Google configurado, se aplicável","WhatsApp Business organizado","Presença digital básica publicada","Meios de pagamento disponíveis","Processo de atendimento definido","Estoque ou capacidade de entrega preparados","Materiais de comunicação prontos","Indicadores básicos de vendas definidos"]},
{title:"3. Estratégia de lançamento",intro:"Escolha como pretende apresentar o negócio ao mercado.",items:["Começar organicamente e testar","Fazer campanha de lançamento","Criar lista de interessados ou pré-venda","Oferecer condição especial de lançamento","Realizar evento de abertura","Criar parcerias antes da abertura","Investir em anúncios pagos","Ativar indicações e relacionamento"]},
{title:"4. Semana de lançamento",intro:"Planeje as ações para os primeiros dias de funcionamento.",items:["Comunicar oficialmente a abertura","Divulgar a oferta de lançamento","Entrar em contato com potenciais clientes","Ativar parceiros e indicações","Publicar conteúdo e demonstrações","Acompanhar contatos e vendas diariamente","Solicitar primeiras avaliações","Corrigir rapidamente problemas identificados"]},
{title:"5. Primeiros 30 dias",intro:"Acompanhe o desempenho e faça os ajustes necessários.",items:["Acompanhar vendas e faturamento","Contar clientes e contatos recebidos","Identificar os canais que geram resultados","Acompanhar custos e despesas","Coletar avaliações e feedbacks","Identificar produtos ou serviços mais vendidos","Revisar preços e ofertas","Ajustar comunicação e campanhas","Estabelecer rotina de atendimento","Definir próximos ajustes e prioridades"]}
],
status:["Não iniciado","Em andamento","Concluído","Não se aplica"],
summaryTag:"LAUNCH READINESS",
summaryTitle:"Seu negócio está pronto para lançar?",
summaryIntro:"Acompanhe o andamento das tarefas que você selecionou como aplicáveis.",
percent:"Prontidão geral",
done:"Concluídos",
pending:"Pendentes",

{title:"1. Before launch",intro:"Review the essentials to avoid starting without a solid foundation.",items:["Business model defined","Initial investment reviewed","Working capital considered","Suppliers selected","Documents and permits checked","Location and structure prepared, if applicable","Brand identity and basic materials defined","Offer and pricing defined"]},
{title:"2. Ready to receive customers",intro:"Check the resources needed to serve customers and make sales.",items:["Google Business Profile set up, if applicable","WhatsApp Business organized","Basic digital presence published","Payment methods available","Customer service process defined","Inventory or delivery capacity prepared","Communication materials ready","Basic sales metrics defined"]},
{title:"3. Launch strategy",intro:"Choose how you plan to introduce the business to the market.",items:["Start organically and test","Run a launch campaign","Create an interested list or pre-sale","Offer a special launch deal","Hold an opening event","Build partnerships before opening","Invest in paid ads","Activate referrals and relationships"]},

{title:"5. First 30 days",intro:"Monitor performance and make the necessary adjustments.",items:["Track sales and revenue","Count customers and incoming leads","Identify channels that generate results","Monitor costs and expenses","Collect reviews and feedback","Identify best-selling products or services","Review prices and offers","Adjust communication and campaigns","Establish a customer service routine","Define next adjustments and priorities"]}
],

sections:[
{title:"1. Antes del lanzamiento",intro:"Revisa los puntos esenciales para no empezar sin estructura.",items:["Modelo de negocio definido","Inversión inicial revisada","Capital de trabajo considerado","Proveedores definidos","Documentos y permisos verificados","Local y estructura preparados, si corresponde","Identidad visual y materiales básicos definidos","Oferta y precios definidos"]},
{title:"2. Preparado para recibir clientes",intro:"Comprueba los recursos necesarios para atender y vender.",items:["Perfil de Empresa en Google configurado, si corresponde","WhatsApp Business organizado","Presencia digital básica publicada","Medios de pago disponibles","Proceso de atención definido","Inventario o capacidad de entrega preparados","Materiales de comunicación listos","Indicadores básicos de ventas definidos"]},
{title:"3. Estrategia de lanzamiento",intro:"Elige cómo piensas presentar el negocio al mercado.",items:["Empezar orgánicamente y probar","Hacer una campaña de lanzamiento","Crear una lista de interesados o preventa","Ofrecer una condición especial de lanzamiento","Realizar un evento de apertura","Crear alianzas antes de abrir","Invertir en anuncios pagados","Activar recomendaciones y relaciones"]},
{title:"4. Semana de lanzamiento",intro:"Planifica las acciones para los primeros días de actividad.",items:["Comunicar oficialmente la apertura","Divulgar la oferta de lanzamiento","Contactar con potenciales clientes","Activar alianzas y recomendaciones","Publicar contenido y demostraciones","Acompañar contactos y ventas diariamente","Solicitar primeras reseñas","Corregir rápidamente los problemas identificados"]},
{title:"5. Primeros 30 días",intro:"Acompaña el desempeño y realiza los ajustes necesarios.",items:["Acompañar ventas e ingresos","Contar clientes y contactos recibidos","Identificar canales que generan resultados","Acompañar costos y gastos","Recoger reseñas y opiniones","Identificar productos o servicios más vendidos","Revisar precios y ofertas","Ajustar comunicación y campañas","Establecer rutina de atención","Definir próximos ajustes y prioridades"]}
],
status:["No iniciado","En progreso","Completado","No aplica"],
summaryTag:"LAUNCH READINESS",
summaryTitle:"¿Está listo tu negocio para lanzar?",
summaryIntro:"Acompaña el progreso de las tareas que has marcado como aplicables.",
percent:"Preparación general",
done:"Completadas",
pending:"Pendientes",
ready:"Tu preparación avanza bien. Revisa las tareas pendientes antes de abrir.",
medium:"Ya tienes parte de la estructura organizada, pero todavía hay puntos importantes por resolver.",
low:"Aún quedan etapas importantes abiertas. Prioriza los puntos esenciales antes de lanzar.",
save:"Guardar mi progreso",
next:"Continuar a MY FIRST 90 DAYS →",
saved:"Progreso guardado en este dispositivo.",

let lang="pt";
let data={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){data={}}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function getItems(section){
let base=T[lang].sections[section].items;
let custom=(data.custom&&data.custom[section])||[];
return [...base,...custom];
}

function render(){
let d=T[lang];
$("eyebrow").textContent=d.eyebrow;
$("subtitle").textContent=d.subtitle;
$("summaryTag").textContent=d.summaryTag;
$("summaryTitle").textContent=d.summaryTitle;
$("summaryIntro").textContent=d.summaryIntro;
$("m1label").textContent=d.percent;
$("m2label").textContent=d.done;
$("m3label").textContent=d.pending;
$("saveButton").textContent=d.save;
$("continueButton").textContent=d.next;

let html="";
d.sections.forEach((section,i)=>{
html+=`<section class="card">
<div class="tag">PHASE ${i+1}</div>
<h2>${section.title}</h2>
<p class="intro">${section.intro}</p>
<div class="tasks">`;
getItems(i).forEach((item,j)=>{
let id=i+"_"+j;
let status=(data.tasks&&data.tasks[id])||0;
html+=`<div class="task">
<label for="task_${id}">${esc(item)}</label>
<select id="task_${id}" data-task="${id}">
${d.status.map((s,k)=>`<option value="${k}" ${Number(status)===k?"selected":""}>${s}</option>`).join("")}
</select>
</div>`;
});
html+=`</div>
<div class="custom">
<input type="text" id="new_${i}" placeholder="${d.placeholder}">
<button class="btn secondary" type="button" data-add="${i}">+ ${d.add}</button>
</div>
</section>`;
});
$("sections").innerHTML=html;
update();
}

function update(){
let total=0,done=0,notApplicable=0;
document.querySelectorAll("[data-task]").forEach(el=>{
let v=Number(el.value);
if(v!==3){
total++;
if(v===2)done++;
}
});
let percent=total?Math.round(done/total*100):0;
let pending=total-done;
$("m1").textContent=percent+"%";
$("m2").textContent=done;
$("m3").textContent=pending;
$("progressBar").style.width=percent+"%";
$("summaryBar").style.width=percent+"%";
let msg=percent>=80?T[lang].ready:percent>=40?T[lang].medium:T[lang].low;
$("readiness").textContent=msg;
$("advice").textContent=T[lang].summaryIntro;
save(false);
}

function save(show=true){
data.tasks=data.tasks||{};
document.querySelectorAll("[data-task]").forEach(el=>{
data.tasks[el.dataset.task]=Number(el.value);
});
try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
if(show)$("saveStatus").textContent=T[lang].saved;
}

document.addEventListener("change",e=>{
if(e.target.matches("[data-task]"))update();
});

document.addEventListener("click",e=>{
let add=e.target.closest("[data-add]");
if(add){
let i=Number(add.dataset.add);
let input=$("new_"+i);
let value=input.value.trim();
if(!value)return;
data.custom=data.custom||{};
data.custom[i]=data.custom[i]||[];
if(!data.custom[i].includes(value))data.custom[i].push(value);
save(false);
render();
}
});

$("language").addEventListener("change",e=>{
lang=e.target.value;
render();
});

$("saveButton").addEventListener("click",()=>save(true));
$("continueButton").addEventListener("click",()=>{
save(true);
window.location.href="my-first-90-days.html";
});

render();
</script>
<script src="toolkit-navigation.js"></script><script src="toolkit-shared-header.js"></script>
<script>
// Starting Toolkit cloud sync. Local storage remains as an offline backup.
(() => {
  const STORAGE_KEY = "startingToolkitLaunchV1";
  const MODULE_KEY = "launch";
  const status = document.getElementById("saveStatus");
  const messages = {
    pt: {saving:"Salvando na nuvem...", saved:"Salvo na nuvem.", local:"Salvo neste navegador. Faça login para sincronizar.", error:"Salvo neste dispositivo, mas houve um erro ao sincronizar."},
    en: {saving:"Saving to the cloud...", saved:"Saved to the cloud.", local:"Saved in this browser. Log in to sync.", error:"Saved on this device, but cloud sync failed."},
    es: {saving:"Guardando en la nube...", saved:"Guardado en la nube.", local:"Guardado en este navegador. Inicia sesión para sincronizar.", error:"Guardado en este dispositivo, pero no se pudo sincronizar."}
  };
  const lang = () => { try { return (localStorage.getItem("startingToolkitLanguage") || localStorage.getItem("startingToolkitLang") || "pt").slice(0,2); } catch (_) { return "pt"; } };
  const msg = k => (messages[lang()] || messages.pt)[k];
  let authenticated = false, timer = null, chain = Promise.resolve(), busy = false;
  async function post(data) {
    if (!authenticated) { if(status) status.textContent=msg("local"); return false; }
    if(status) status.textContent=msg("saving");
    try {
      const response=await fetch(`/api/modules/${MODULE_KEY}`,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({data})});
      const result=await response.json().catch(()=>({}));
      if(!response.ok || result.ok!==true || result.saved!==true) throw new Error(result.error || "Save failed");
      if(status) status.textContent=msg("saved");
      return true;
    } catch(e) { if(status) status.textContent=msg("error"); return false; }
  }
  function queue(data) {
    if(!authenticated || busy) return;
    clearTimeout(timer);
    timer=setTimeout(()=>{ chain=chain.then(()=>post(data)); },700);
  }
  async function init() {
    try {
      const authRes=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});
      if(!authRes.ok) { if(status) status.textContent=msg("local"); return; }
      const auth=await authRes.json();
      if(!auth.authenticated || !auth.businessPlanId) { if(status) status.textContent=msg("local"); return; }
      authenticated=true;
      const cloudRes=await fetch(`/api/modules/${MODULE_KEY}`,{credentials:"same-origin",cache:"no-store"});
      if(!cloudRes.ok) throw new Error("Cloud load failed");
      const cloud=await cloudRes.json();
      const local=localStorage.getItem(STORAGE_KEY);
      if(cloud.data) {
        const cloudText=JSON.stringify(cloud.data);
        if(local!==cloudText && !sessionStorage.getItem("stk_cloud_hydrated_"+MODULE_KEY)) {
          busy=true; localStorage.setItem(STORAGE_KEY,cloudText); sessionStorage.setItem("stk_cloud_hydrated_"+MODULE_KEY,"1"); location.reload(); return;
        }
        if(status) status.textContent=msg("saved");
      } else if(local) {
        let parsed; try { parsed=JSON.parse(local); } catch(_) { parsed=null; }
        if(parsed && typeof parsed==="object") await post(parsed);
      } else if(status) status.textContent=msg("saved");
      const original=Storage.prototype.setItem;
      Storage.prototype.setItem=function(k,v) {
        original.call(this,k,v);
        if(this===localStorage && k===STORAGE_KEY && authenticated && !busy) {
          try { queue(JSON.parse(v)); } catch(_) {}
        }
      };
    } catch(e) { if(status) status.textContent=msg("error"); }
  }
  init();
})();
</script>
</body>
</html>
