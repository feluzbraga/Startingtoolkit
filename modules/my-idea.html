
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Toolkit | My Idea</title>

<style>
:root {
  --navy:#19283d;
  --purple:#6c63ff;
  --soft:#f0efff;
  --bg:#f6f7fb;
  --muted:#667085;
  --line:#e4e7ec;
  --white:#fff;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--navy);
  line-height:1.5;
}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
.app {max-width:1080px;margin:auto;padding:24px 18px 60px}
.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}
.brand {font-weight:800;letter-spacing:2px;font-size:14px;color:inherit;text-decoration:none}
.top-right {display:flex;align-items:center;gap:12px}
.lang {border:1px solid var(--line);background:white;border-radius:10px;padding:9px}
.home {font-size:13px;color:var(--purple);text-decoration:none}
.hero {
  background:var(--navy);
  color:white;
  border-radius:22px;
  padding:28px 30px;
  margin-bottom:18px;
}
.eyebrow {font-size:11px;letter-spacing:1.5px;font-weight:800;opacity:.8}
.hero h1 {font-size:30px;margin:8px 0}
.hero p {max-width:740px;margin:0;opacity:.88;font-size:15px}
.progress {margin-top:22px}
.progress-top {display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.bar {height:8px;background:#ffffff30;border-radius:20px;overflow:hidden}
.bar i {display:block;height:100%;width:0;background:#b8e986;transition:width .2s}
.card {
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:25px;
  margin-bottom:17px;
}
.section-title {font-size:20px;margin:0 0 6px}
.section-help {color:var(--muted);font-size:14px;margin:0 0 22px}
.q {margin:24px 0}
.q>label,.mini {display:block;font-weight:700;margin-bottom:8px}
.help {font-size:13px;color:var(--muted);margin:-2px 0 10px}
input,select,textarea {
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
  background:white;
  color:var(--navy);
  outline:none;
}
textarea {min-height:85px;resize:vertical}
input:focus,select:focus,textarea:focus {
  border-color:var(--purple);
  box-shadow:0 0 0 3px #6c63ff18;
}
.subgrid {display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opts {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.opt {
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:12px;
  text-align:left;
  color:var(--navy);
  min-height:46px;
}
.opt:hover {border-color:#aaa5ff}
.opt.selected {
  border-color:var(--purple);
  background:var(--soft);
  font-weight:700;
  color:#5148d9;
  box-shadow:0 0 0 1px var(--purple);
}
.conditional {
  display:none;
  margin-top:14px;
  padding:17px;
  background:#f7f8fc;
  border:1px solid var(--line);
  border-radius:14px;
}
.conditional.show {display:block}
.note {
  background:#f0f3f8;
  border:1px solid #dce4ee;
  border-radius:12px;
  padding:13px;
  color:#475467;
  font-size:13px;
  margin-top:12px;
}
.actions {display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.btn {border:0;border-radius:11px;padding:13px 18px;font-weight:700}
.primary {background:var(--purple);color:white}
.secondary {background:white;color:var(--navy);border:1px solid var(--line)}
.save {font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}
.result-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.ri {border:1px solid var(--line);border-radius:13px;padding:13px;overflow-wrap:anywhere}
.ri small {
  display:block;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:5px;
}
.ri div {font-size:14px;white-space:pre-wrap}
.hidden {display:none!important}

@media(max-width:650px) {
  .app {padding:15px 12px 40px}
  .hero {padding:23px 19px}
  .hero h1 {font-size:25px}
  .subgrid,.opts,.result-grid {grid-template-columns:1fr}
  .actions {flex-direction:column}
  .btn {width:100%}
}
</style>
</head>

<div class="app">

<header class="top">
  <a class="brand" href="../index.html">STARTING TOOLKIT</a>

      <option value="en">EN</option>
      <option value="es">ES</option>

</header>

<section class="hero">

      <strong id="progressPct">0%</strong>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</section>

<section id="form" class="card">

  <p class="section-help" id="intro"></p>

  <div class="q">
    <label id="qName"></label>
    <div class="help" id="nameHelp"></div>
    <input id="name" autocomplete="organization">
  </div>

  <div class="q">
    <label id="baseLocationQ"></label>
    <div class="help" id="baseLocationHelp"></div>
    <div class="subgrid">
      <div>
        <label class="mini" id="cityLabel"></label>
        <input id="baseCity">
      </div>
      <div>
        <label class="mini" id="stateLabel"></label>
        <input id="baseState">
      </div>
    </div>
    <div style="margin-top:12px">
      <label class="mini" id="countryLabel"></label>
      <input id="baseCountry">
    </div>
  </div>

  <div class="q">
    <label id="typeQ"></label>
    <div class="opts" id="typeOpts"></div>
  </div>

  <div class="q">
    <label id="productQ"></label>
    <div class="opts" id="productOpts"></div>
  </div>

  <div class="q">
    <label id="sectorQ"></label>
    <div class="opts" id="sectorOpts"></div>
    <input id="sectorOther" class="hidden" style="margin-top:10px">
  </div>

  <div class="q">
    <label id="formatQ"></label>
    <div class="opts" id="formatOpts"></div>

    <div class="conditional" id="locationConditional">
      <label id="locationStatusQ"></label>
      <div class="opts" id="locationStatusOpts"></div>

      <div style="margin-top:16px">
        <label id="locationTypeQ"></label>
        <div class="opts" id="locationTypeOpts"></div>
        <input id="locationTypeOther" class="hidden" style="margin-top:10px">
      </div>

      <div style="margin-top:16px">
        <label id="propertyStatusQ"></label>
        <div class="opts" id="propertyStatusOpts"></div>
      </div>

      <div style="margin-top:16px">
        <label id="locationPriorityQ"></label>
        <div class="opts" id="locationPriorityOpts"></div>
      </div>
    </div>
  </div>

  <div class="q">
    <label id="problemQ"></label>
    <textarea id="problem"></textarea>
  </div>

  <div class="q">
    <label id="customerQ"></label>
    <div class="help" id="customerHelp"></div>

    <div class="subgrid">
      <div>
        <label class="mini" id="ageLabel"></label>
        <select id="age"></select>
      </div>
      <div>
        <label class="mini" id="genderLabel"></label>
        <select id="gender"></select>
      </div>
      <div>
        <label class="mini" id="incomeLabel"></label>
        <select id="income"></select>
      </div>
      <div>
        <label class="mini" id="customerLocationLabel"></label>
        <input id="customerLocation">
      </div>
    </div>

    <div style="margin-top:14px">
      <label id="customerProfileLabel"></label>
      <textarea id="customer"></textarea>
    </div>

    <div class="note" id="customerNote"></div>

    <div style="margin-top:16px">
      <label id="audienceRoleQ"></label>
      <div class="opts" id="audienceRoleOpts"></div>
    </div>

    <div style="margin-top:16px">
      <label id="serviceAreaQ"></label>
      <div class="help" id="serviceAreaHelp"></div>
      <div class="opts" id="serviceAreaOpts"></div>
      <input id="serviceAreaDetail" style="margin-top:10px">
    </div>
  </div>

  <div class="q">
    <label id="differenceQ"></label>
    <textarea id="difference"></textarea>
  </div>

  <div class="q">
    <label id="experienceQ"></label>
    <div class="opts" id="experienceOpts"></div>
  </div>

  <div class="q">
    <label id="investmentQ"></label>
    <div class="opts" id="investmentOpts"></div>
  </div>

  <div class="q">
    <label id="goalQ"></label>
    <div class="opts" id="goalOpts"></div>
    <input id="goalOther" class="hidden" style="margin-top:10px">
  </div>

  <div class="actions">
    <button class="btn secondary" id="saveBtn" type="button"></button>
    <button class="btn primary" id="resultBtn" type="button"></button>
  </div>
  <div class="save" id="saveStatus" aria-live="polite"></div>
</section>

<section id="result" class="card hidden">
  <h2 class="section-title" id="resultTitle"></h2>
  <p class="section-help" id="resultHelp"></p>
  <div class="result-grid" id="resultGrid"></div>
  <div class="actions">
    <button class="btn secondary" id="editBtn" type="button"></button>
    <button class="btn primary" id="continueBtn" type="button"></button>
  </div>
</section>

</div>

const $ = id => document.getElementById(id);

/* Recupera corretamente opções múltiplas e únicas */
function selectedValues(key) {
  const value = state[key];
  if (Array.isArray(value)) return value;
  if (value !== "" && value !== null && value !== undefined) {
    return [Number(value)];
  }
  return [];
}

function renderOptions(id,values,key,multiple=true) {
  const el = $(id);
  el.innerHTML = "";

  values.forEach((value,index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "opt";
    button.textContent = value;
    button.dataset.index = index;

    button.addEventListener("click",() => {
      if (multiple) {
        const current = selectedValues(key);
        state[key] = current.includes(index)
          ? current.filter(item => item !== index)
          : [...current,index];
      } else {
        state[key] = String(index);
      }

      renderSelected(id,key);
      updateConditional();
      updateProgress();
      save(false);
    });

    el.appendChild(button);
  });

  renderSelected(id,key);
}

function renderSelected(id,key) {
  const el = $(id);
  const selected = selectedValues(key).map(String);

  el.querySelectorAll(".opt").forEach(button => {
    button.classList.toggle("selected",selected.includes(button.dataset.index));
  });
}

function renderSelect(id,values,key) {
  const el = $(id);
  const d = D[state.lang];
  el.innerHTML = "";

  const first = document.createElement("option");
  first.value = "";
  first.textContent = d.choose;
  el.appendChild(first);

  values.forEach((value,index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = value;
    el.appendChild(option);
  });

  el.value = state[key] ?? "";

  el.onchange = () => {
    state[key] = el.value;
    updateProgress();
    save(false);
  };
}

function applyText() {
  const d = D[state.lang];

  document.documentElement.lang = state.lang === "pt" ? "pt-BR" : state.lang;

  const textMap = {
    eyebrow:"eyebrow",
    title:"title",
    lead:"lead",
    progressLabel:"progress",
    moduleTitle:"module",
    intro:"intro",
    homeLink:"home",
    qName:"qName",
    nameHelp:"nameHelp",
    baseLocationQ:"baseLocationQ",
    baseLocationHelp:"baseLocationHelp",
    cityLabel:"city",
    stateLabel:"state",
    countryLabel:"country",
    typeQ:"typeQ",
    productQ:"productQ",
    sectorQ:"sectorQ",
    formatQ:"formatQ",
    locationStatusQ:"locationStatusQ",
    locationTypeQ:"locationTypeQ",
    propertyStatusQ:"propertyStatusQ",
    locationPriorityQ:"locationPriorityQ",
    problemQ:"problemQ",
    customerQ:"customerQ",
    customerHelp:"customerHelp",
    ageLabel:"ageLabel",
    genderLabel:"genderLabel",
    incomeLabel:"incomeLabel",
    customerLocationLabel:"customerLocationLabel",
    customerProfileLabel:"customerProfileLabel",
    customerNote:"customerNote",
    audienceRoleQ:"audienceRoleQ",
    serviceAreaQ:"serviceAreaQ",
    serviceAreaHelp:"serviceAreaHelp",
    differenceQ:"differenceQ",
    experienceQ:"experienceQ",
    investmentQ:"investmentQ",
    goalQ:"goalQ",
    saveBtn:"save",
    resultBtn:"result",
    resultTitle:"resultTitle",
    resultHelp:"resultHelp",
    editBtn:"edit",
    continueBtn:"continue"
  };

  Object.entries(textMap).forEach(([id,key]) => {
    $(id).textContent = d[key];
  });

  $("sectorOther").placeholder = d.otherSector;
  $("locationTypeOther").placeholder = d.otherLocation;
  $("goalOther").placeholder = d.otherGoal;
  $("serviceAreaDetail").placeholder = d.serviceAreaDetail;

  renderOptions("typeOpts",d.type,"type",true);
  renderOptions("productOpts",d.products,"product",true);
  renderOptions("sectorOpts",d.sectors,"sector",false);
  renderOptions("formatOpts",d.format,"format",true);
  renderOptions("locationStatusOpts",d.locationStatus,"locationStatus",false);
  renderOptions("locationTypeOpts",d.locationType,"locationType",false);
  renderOptions("propertyStatusOpts",d.propertyStatus,"propertyStatus",false);
  renderOptions("locationPriorityOpts",d.locationPriority,"locationPriority",true);
  renderOptions("audienceRoleOpts",d.audienceRole,"audienceRole",false);
  renderOptions("serviceAreaOpts",d.serviceArea,"serviceArea",false);
  renderOptions("experienceOpts",d.experience,"experience",false);
  renderOptions("investmentOpts",d.investment,"investment",false);
  renderOptions("goalOpts",d.goals,"goal",true);

  renderSelect("age",d.age,"age");
  renderSelect("gender",d.gender,"gender");
  renderSelect("income",d.income,"income");

  updateConditional();
}

function updateConditional() {
  const d = D[state.lang];
  const selectedFormats = selectedValues("format").map(i => d.format[i]);

  const showLocation = selectedFormats.some(value =>
    ["Físico","Híbrido","Physical","Hybrid","Físico","Híbrido"].includes(value)
  );

  $("locationConditional").classList.toggle("show",showLocation);

  $("sectorOther").classList.toggle("hidden",Number(state.sector) !== 23);
  $("locationTypeOther").classList.toggle("hidden",Number(state.locationType) !== 8);
  $("goalOther").classList.toggle("hidden",!selectedValues("goal").includes(5));
}

function collect() {
  [
    "name","baseCity","baseState","baseCountry",
    "problem","customerLocation","customer",
    "serviceAreaDetail","difference",
    "sectorOther","locationTypeOther","goalOther"
  ].forEach(id => {
    state[id] = $(id).value.trim();
  });

  ["age","gender","income"].forEach(id => {
    state[id] = $(id).value;
  });
}

let ideaCloudTimer = null;
let ideaCloudAuthenticated = false;
let ideaCloudSaveChain = Promise.resolve();

async function sendIdeaCloudSave(data, showStatus=false) {
  const d = D[state.lang];
  if (!ideaCloudAuthenticated) {
    if (showStatus) $("saveStatus").textContent = d.localOnly;
    return false;
  }
  try {
    const response = await fetch("/api/modules/idea", {
      method:"POST",
      credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({data})
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || result.ok !== true || result.saved !== true) {
      throw new Error(result.error || "Cloud save failed");
    }
    $("saveStatus").textContent = D[state.lang].savedCloud;
    return true;
  } catch (error) {
    $("saveStatus").textContent = D[state.lang].cloudError;
    return false;
  }
}

function queueIdeaCloudSave(data, immediate=false) {
  clearTimeout(ideaCloudTimer);
  if (immediate) {
    $("saveStatus").textContent = D[state.lang].saving;
    ideaCloudSaveChain = ideaCloudSaveChain.then(() => sendIdeaCloudSave(data, true));
    return ideaCloudSaveChain;
  }
  if (!ideaCloudAuthenticated) return;
  ideaCloudTimer = setTimeout(() => {
    ideaCloudSaveChain = ideaCloudSaveChain.then(() => sendIdeaCloudSave(data, false));
  }, 900);
}

async function prepareIdeaCloudData() {
  try {
    const authResponse = await fetch("/api/auth/me", {credentials:"same-origin", cache:"no-store"});
    if (!authResponse.ok) return;
    const auth = await authResponse.json();
    if (!auth.authenticated || !auth.businessPlanId) return;
    ideaCloudAuthenticated = true;
    const cloudResponse = await fetch("/api/modules/idea", {credentials:"same-origin", cache:"no-store"});
    if (!cloudResponse.ok) return;
    const cloud = await cloudResponse.json();
    const local = localStorage.getItem(STORAGE_KEY);
    if (cloud.data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cloud.data));
    } else if (local) {
      try { await queueIdeaCloudSave(JSON.parse(local)); } catch (_) {}
    }
  } catch (error) {
    // The module remains usable locally if the cloud is unavailable.
  }
}

function save(showMessage=true) {
  collect();

  const d = D[state.lang];
  const businessLocation = [
    state.baseCity,state.baseState,state.baseCountry
  ].filter(Boolean).join(", ");

  const goalLabels = selectedValues("goal").map(i => d.goals[i]);

  if (state.goalOther && selectedValues("goal").includes(5)) {
    goalLabels.push(state.goalOther);
  }

  const sectorLabel = state.sector === ""
    ? ""
    : Number(state.sector) === 23
      ? state.sectorOther
      : d.sectors[Number(state.sector)];

  const locationTypeLabel = state.locationType === ""
    ? ""
    : Number(state.locationType) === 8
      ? state.locationTypeOther
      : d.locationType[Number(state.locationType)];

  const data = {
    ...state,
    businessName:state.name,
    name:state.name,
    customerDescription:state.customer,
    idealCustomer:state.customer,
    baseLocation:businessLocation,
    location:businessLocation,
    goals:goalLabels,
    goal:goalLabels,
    sectorName:sectorLabel,
    locationTypeName:locationTypeLabel,
    initialInvestment:state.investment !== ""
      ? d.investment[Number(state.investment)]
      : "",
    updatedAt:new Date().toISOString()
  };

  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  if (showMessage) {
    queueIdeaCloudSave(data, true);
  } else {
    queueIdeaCloudSave(data, false);
  }
}

function load() {
  let saved = null;

  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

    if (!saved) {
      saved = JSON.parse(localStorage.getItem("startingToolkitIdea") || "null");
    }
  } catch(error) {
    saved = null;
  }

  if (saved) {
    Object.keys(state).forEach(key => {
      if (saved[key] !== undefined) {
        state[key] = saved[key];
      }
    });

    if (!Array.isArray(state.type)) state.type = [];
    if (!Array.isArray(state.product)) state.product = [];
    if (!Array.isArray(state.format)) state.format = [];
    if (!Array.isArray(state.locationPriority)) state.locationPriority = [];
    if (!Array.isArray(state.goal)) {
      state.goal = state.goal === "" ? [] : [];
    }
  }

  [
    "name","baseCity","baseState","baseCountry",
    "problem","customerLocation","customer",
    "serviceAreaDetail","difference",
    "sectorOther","locationTypeOther","goalOther"
  ].forEach(id => {
    $(id).value = state[id] || "";
  });

  ["age","gender","income"].forEach(id => {
    $(id).value = state[id] ?? "";
  });
}

function updateProgress() {
  collect();

  const checks = [
    state.name,
    state.baseCity,
    selectedValues("type").length,
    selectedValues("product").length,
    state.sector !== "",
    selectedValues("format").length,
    state.problem,
    state.customer,
    state.age !== "" || state.gender !== "" || state.income !== "",
    state.audienceRole !== "",
    state.serviceArea !== "",
    state.difference,
    state.experience !== "",
    state.investment !== "",
    selectedValues("goal").length
  ];

  const percentage = Math.round(
    checks.filter(Boolean).length / checks.length * 100
  );

  $("progressPct").textContent = percentage + "%";
  $("bar").style.width = percentage + "%";
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function showResult() {
  save(false);

  const d = D[state.lang];

  const list = (key,values) =>
    selectedValues(key).map(i => values[i]).filter(Boolean).join(", ");

  const locationDetails = [
    state.locationStatus !== ""
      ? d.locationStatus[Number(state.locationStatus)]
      : "",
    state.locationType !== ""
      ? Number(state.locationType) === 8
        ? state.locationTypeOther
        : d.locationType[Number(state.locationType)]
      : "",
    state.propertyStatus !== ""
      ? d.propertyStatus[Number(state.propertyStatus)]
      : "",
    list("locationPriority",d.locationPriority)
  ].filter(Boolean).join(" | ");

  const sectorText = state.sector === ""
    ? "–"
    : Number(state.sector) === 23
      ? state.sectorOther || "–"
      : d.sectors[Number(state.sector)];

  const goalText = [
    list("goal",d.goals),
    selectedValues("goal").includes(5) ? state.goalOther : ""
  ].filter(Boolean).join(": ");

  const customerDetails = [
    state.age !== "" ? d.age[Number(state.age)] : "",
    state.gender !== "" ? d.gender[Number(state.gender)] : "",
    state.income !== "" ? d.income[Number(state.income)] : "",
    state.customerLocation,
    state.customer
  ].filter(Boolean).join(" | ");

  const values = [
    state.name || "–",
    [state.baseCity,state.baseState,state.baseCountry].filter(Boolean).join(", ") || "–",
    list("type",d.type) || "–",
    list("product",d.products) || "–",
    sectorText,
    list("format",d.format) || "–",
    locationDetails || "–",
    state.problem || "–",
    customerDetails || "–",
    state.audienceRole !== "" ? d.audienceRole[Number(state.audienceRole)] : "–",
    state.serviceArea !== "" ? d.serviceArea[Number(state.serviceArea)] : "–",
    state.serviceAreaDetail || "–",
    state.difference || "–",
    state.experience !== "" ? d.experience[Number(state.experience)] : "–",
    state.investment !== "" ? d.investment[Number(state.investment)] : "–",
    goalText || "–"
  ];

  $("resultGrid").innerHTML = values.map((value,index) =>
    `<div class="ri"><small>${d.labels[index]}</small><div>${escapeHTML(value)}</div></div>`
  ).join("");

  $("form").classList.add("hidden");
  $("result").classList.remove("hidden");

  window.scrollTo({top:0,behavior:"smooth"});
}

/* Eventos */
$("language").addEventListener("change",() => {
  state.lang = $("language").value;
  localStorage.setItem(LANG_KEY,state.lang);
  localStorage.setItem("startingToolkitLang",state.lang);
  applyText();
  updateProgress();
});

$("saveBtn").addEventListener("click",() => save(true));

$("resultBtn").addEventListener("click",showResult);

$("editBtn").addEventListener("click",() => {
  $("result").classList.add("hidden");
  $("form").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
});

$("continueBtn").addEventListener("click",() => {
  save(false);
  window.location.href = "my-model.html";
});

[
  "name","baseCity","baseState","baseCountry",
  "problem","customerLocation","customer",
  "serviceAreaDetail","difference",
  "sectorOther","locationTypeOther","goalOther"
].forEach(id => {
  $(id).addEventListener("input",() => {
    updateProgress();
    save(false);
  });
});

["age","gender","income"].forEach(id => {
  $(id).addEventListener("change",() => {
    updateProgress();
    save(false);
  });
});

/* Inicialização */
state.lang =
  localStorage.getItem(LANG_KEY) ||
  localStorage.getItem("startingToolkitLang") ||
  "pt";

$("language").value = state.lang;

(async function initIdeaModule() {
  await prepareIdeaCloudData();
  load();
  applyText();
  updateProgress();
})();
</script>
