<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reenviar ativação | Starting Toolkit"><style>body{font-family:Arial,sans-serif;background:#f5f7f7;color:#263943;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}.card{width:min(100%,440px);background:#fff;border:1px solid #e4e9e9;border-radius:18px;padding:32px;box-shadow:0 12px 35px #172d3b14}.brand{text-align:center;font-weight:bold;color:#172d3b;font-size:20px}.brand span{color:#c6a66b}h1{text-align:center;color:#172d3b;font-size:24px;margin:28px 0 8px}p{text-align:center;color:#71818a;font-size:14px;line-height:1.5}label{display:block;font-weight:bold;font-size:13px;margin:20px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd6dc;border-radius:9px;font:inherit}button{width:100%;padding:14px;background:#172d3b;color:#fff;border:0;border-radius:9px;font-weight:bold;margin-top:22px;cursor:pointer}#message{min-height:24px;text-align:center;margin-top:16px;font-size:13px}.back{text-align:center;margin-top:18px;font-size:13px}.back a{color:#4f8b87;text-decoration:none}</style></head><body><main class="card"><div class="brand">STARTING<span>TOOLKIT</span></div><h1 id="title">Reenviar e-mail de ativação</h1><p id="intro">Informe o mesmo e-mail usado na compra da Hotmart.</p><form id="form"><label for="email" id="emailLabel">E-mail da compra</label><input id="email" type="email" required autocomplete="email"><button id="submit">Enviar novo link</button></form><div id="message" role="status"></div><div class="back"><a href="/login.html" id="back">Voltar ao login</a></div></main><script>const copy={pt:{title:'Reenviar e-mail de ativação',intro:'Informe o mesmo e-mail usado na compra da Hotmart.',email:'E-mail da compra',submit:'Enviar novo link',loading:'Enviando...',done:'Se houver uma compra aprovada pendente de ativação, enviaremos um novo link. Confira também o spam.',error:'Não foi possível enviar agora. Tente novamente.',back:'Voltar ao login'},en:{title:'Resend activation email',intro:'Enter the same email address used for your Hotmart purchase.',email:'Purchase email',submit:'Send a new link',loading:'Sending...',done:'If there is an approved purchase awaiting activation, a new link will be sent. Check your spam folder too.',error:'Could not send now. Please try again.',back:'Back to sign in'},es:{title:'Reenviar correo de activación',intro:'Introduce el mismo correo utilizado en tu compra de Hotmart.',email:'Correo de compra',submit:'Enviar nuevo enlace',loading:'Enviando...',done:'Si hay una compra aprobada pendiente de activación, enviaremos un nuevo enlace. Revisa también el spam.',error:'No se pudo enviar ahora. Inténtalo de nuevo.',back:'Volver al inicio de sesión'}};const $=id=>document.getElementById(id),lang=localStorage.getItem('startingToolkitLanguage')||'pt',t=copy[lang]||copy.pt;document.documentElement.lang=lang==='pt'?'pt-BR':lang;for(const [id,key] of [['title','title'],['intro','intro'],['emailLabel','email'],['submit','submit'],['back','back']])$(id).textContent=t[key];$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent=t.loading;try{const r=await fetch('/api/auth/resend-activation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,language:lang})});if(!r.ok)throw new Error();$('message').textContent=t.done}catch(e){$('message').textContent=t.error;$('submit').disabled=false}});</script></body></html>
