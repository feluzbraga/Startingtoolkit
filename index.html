
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starting Toolkit | Pense. Planeje. Comece.</title>
<meta name="description" content="Ferramentas práticas para avaliar sua ideia, planejar e começar seu negócio.">
<style>
:root {
  --bg:#f6f7fb;--white:#fff;--ink:#19202c;
  --muted:#667085;--purple:#6c63ff;
  --purple-dark:#5148d9;--soft:#f0efff;--line:#e4e7ec;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
.container{width:min(1120px,calc(100% - 40px));margin:auto}
header{padding:20px 0;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:800;letter-spacing:2px}
.language{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:white;color:var(--ink)}
.hero{padding:76px 0 65px;background:linear-gradient(135deg,#fff,#f0efff);border:1px solid var(--line);border-radius:24px;margin:12px 0 55px}
.hero-content{max-width:760px;padding:0 50px}
.eyebrow{display:inline-block;color:var(--purple-dark);background:var(--soft);border-radius:30px;padding:7px 13px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
h1{font-size:clamp(38px,6vw,64px);line-height:1.06;letter-spacing:-2px;margin:22px 0 18px}
.hero p{color:var(--muted);font-size:19px;max-width:650px;margin:0 0 27px}
.button{display:inline-block;background:var(--purple);color:white;border-radius:11px;padding:13px 21px;font-weight:700;transition:.2s}
.button:hover{background:var(--purple-dark)}
.section{margin:55px 0}
.section-heading{max-width:700px;margin-bottom:25px}
.section-heading h2{font-size:30px;letter-spacing:-.7px;margin:0 0 8px}
.section-heading p{color:var(--muted);margin:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:white;border:1px solid var(--line);border-radius:17px;padding:23px}
.number{color:var(--purple);font-size:13px;font-weight:800;letter-spacing:1px}
.step h3{margin:12px 0 6px}
.step p{color:var(--muted);margin:0;font-size:14px}
.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.module{background:white;border:1px solid var(--line);border-radius:16px;padding:21px;min-height:165px;display:flex;flex-direction:column}
.module-number{color:var(--purple);font-size:12px;font-weight:800;letter-spacing:1px}
.module h3{margin:9px 0 5px;font-size:17px}
.module p{color:var(--muted);font-size:13px;margin:0}
.module-status{margin-top:auto;padding-top:16px;color:#9a6a16;font-size:12px;font-weight:700}
.module.available{cursor:pointer}
.module.available:hover{border-color:var(--purple)}
.final-card{background:var(--ink);color:white;border-radius:22px;padding:35px;display:flex;align-items:center;justify-content:space-between;gap:25px}
.final-card p{color:#d0d5dd;max-width:620px}
.final-card .button{background:white;color:var(--purple-dark);white-space:nowrap}
.credibility{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;align-items:center;gap:25px}
.credibility-number{font-size:42px;font-weight:800;color:var(--purple);white-space:nowrap}
.credibility p{color:var(--muted);margin:0}
footer{border-top:1px solid var(--line);margin-top:65px;padding:28px 0;color:var(--muted);font-size:13px}
footer .container{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
@media(max-width:760px){
.hero{padding:55px 0}.hero-content{padding:0 25px}
.steps,.modules{grid-template-columns:1fr 1fr}
.final-card{flex-direction:column;align-items:flex-start}
}
@media(max-width:500px){
.container{width:calc(100% - 28px)}
.steps,.modules{grid-template-columns:1fr}
.hero-content{padding:0 20px}
.hero p{font-size:16px}
.section-heading h2{font-size:25px}
.credibility{align-items:flex-start;flex-direction:column;gap:5px}
}
</style>
</head>
<body>

<header class="container">
<a class="logo" href="index.html">STARTING TOOLKIT</a>
<select class="language" id="language" aria-label="Selecionar idioma">

<option value="en">EN</option>

<div class="steps">

<article class="step">

</div>
</section>

<section class="section" id="modules">
<div class="section-heading">

<p id="modulesText"></p>
</div>
<div class="modules" id="moduleGrid"></div>
</section>

<section class="section">
<div class="final-card">
<div>
<span class="eyebrow" id="finalEyebrow"></span>
<h2 id="finalTitle"></h2>
<p id="finalText"></p>
</div>
<a class="button" href="your-final-plan.html" id="finalButton"></a>
</div>
</section>

<section class="section">
<div class="credibility">
<div class="credibility-number">25+</div>
<p id="credibilityText"></p>
</div>
</section>

</main>

<footer>
<div class="container">
<strong>STARTING TOOLKIT</strong>
<span id="footerText"></span>
<span>© <span id="year"></span> Starting Toolkit</span>
</div>
</footer>

const moduleFiles=[
"modules/my-idea.html",
"modules/my-model.html",
"modules/my-market.html",
"modules/my-swot.html",
"modules/my-numbers.html",
"modules/my-marketing.html",
"modules/my-launch.html",
"modules/my-first-90-days.html"
];

function changeLanguage(lang){
const t=translations[lang]||translations.pt;
document.documentElement.lang=lang==="pt"?"pt-BR":lang;

Object.keys(t).forEach(key=>{
if(key==="modules"||key==="moduleLabel"||key==="status")return;
const element=document.getElementById(key);
if(element)element.textContent=t[key];
});

const grid=document.getElementById("moduleGrid");
grid.innerHTML="";

t.modules.forEach((module,index)=>{
const card=document.createElement("article");
card.className="module";
card.innerHTML=`
<span class="module-number"></span>
<h3></h3>
<p></p>
<span class="module-status"></span>
`;
card.querySelector(".module-number").textContent=
t.moduleLabel+" "+String(index+1).padStart(2,"0");
card.querySelector("h3").textContent=module[0];
card.querySelector("p").textContent=module[1];
card.querySelector(".module-status").textContent=t.status;
grid.appendChild(card);
});

document.getElementById("year").textContent=new Date().getFullYear();
localStorage.setItem("startingToolkitLanguage",lang);
}

const selector=document.getElementById("language");
const savedLanguage=localStorage.getItem("startingToolkitLanguage")||"pt";
selector.value=savedLanguage;
selector.addEventListener("change",()=>changeLanguage(selector.value));
changeLanguage(savedLanguage);
</script>
