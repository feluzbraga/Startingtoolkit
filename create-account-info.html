<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ativar acesso | Starting Toolkit"><style>body{font-family:Arial,sans-serif;background:#f5f7f7;color:#263943;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}.card{max-width:480px;background:#fff;border:1px solid #e4e9e9;border-radius:18px;padding:32px;text-align:center}.brand{font-weight:bold;color:#172d3b;font-size:20px}.brand span{color:#c6a66b}h1{font-size:24px;color:#172d3b;margin-top:28px}p{color:#71818a;line-height:1.6;font-size:14px}a{color:#4f8b87}</style></head><body><main class="card"><div class="brand">STARTING<span>TOOLKIT</span></div><h1 id="title">Ative seu acesso pelo e-mail</h1><p id="text">Após a confirmação da compra, enviamos automaticamente um link individual para o e-mail informado na Hotmart. Abra essa mensagem para criar sua senha. Se acabou de comprar, aguarde alguns minutos e confira também a pasta de spam.</p><p><a href="/resend-activation.html" id="resend">Não recebeu o e-mail? Enviar novamente</a></p><p><a href="/login.html" id="login">Voltar ao login</a></p></main><script>const l=localStorage.getItem('startingToolkitLanguage')||'pt',t={pt:['Ative seu acesso pelo e-mail','Após a confirmação da compra, enviamos automaticamente um link individual para o e-mail informado na Hotmart. Abra essa mensagem para criar sua senha. Se acabou de comprar, aguarde alguns minutos e confira também a pasta de spam.','Voltar ao login'],en:['Activate your access by email','After your purchase is confirmed, we automatically send a personal link to the email address used at Hotmart. Open that message to create your password. If you just purchased, wait a few minutes and check your spam folder too.','Back to sign in'],es:['Activa tu acceso por correo','Después de confirmar la compra, enviamos automáticamente un enlace personal al correo utilizado en Hotmart. Abre ese mensaje para crear tu contraseña. Si acabas de comprar, espera unos minutos y revisa también la carpeta de spam.','Volver al inicio de sesión']}[l]||[];document.documentElement.lang=l==='pt'?'pt-BR':l;document.getElementById('title').textContent=t[0];document.getElementById('text').textContent=t[1];document.getElementById('login').textContent=t[2];document.getElementById('resend').textContent=({pt:'Não recebeu o e-mail? Enviar novamente',en:'Did not receive the email? Send it again',es:'¿No recibiste el correo? Enviarlo de nuevo'})[l]||'Resend activation email';</script></body></html>
