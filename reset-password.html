<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nova senha | Starting Toolkit"><style>:root{--navy:#172d3b;--teal:#4f8b87;--gold:#c6a66b;--bg:#f5f7f7;--muted:#71818a;--line:#e4e9e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Arial,sans-serif;color:#263943}.card{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 12px 35px #172d3b14}.brand{text-align:center;font-size:20px;font-weight:700;color:var(--navy)}.brand span{color:var(--gold)}h1{text-align:center;color:var(--navy);font-size:24px;margin:28px 0 8px}p{text-align:center;color:var(--muted);font-size:14px}label{display:block;font-size:13px;font-weight:bold;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd6dc;border-radius:9px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:9px;background:var(--navy);color:white;font-weight:bold;margin-top:22px;cursor:pointer}#message{min-height:24px;margin-top:16px;text-align:center;font-size:13px}.back{text-align:center;margin-top:20px;font-size:13px}.back a{color:var(--teal);text-decoration:none}</style></head><body><main class="card"><div class="brand">STARTING<span>TOOLKIT</span></div><h1 id="title">Criar nova senha</h1><p id="intro">Escolha uma nova senha com pelo menos 12 caracteres.</p><form id="form"><label id="passwordLabel" for="password">Nova senha</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label id="confirmLabel" for="confirm">Confirmar senha</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button id="submit">Salvar nova senha</button></form><div id="message" role="status"></div><div class="back"><a href="/login.html" id="back">Voltar ao login</a></div></main><script>const c={pt:{title:'Criar nova senha',intro:'Escolha uma nova senha com pelo menos 12 caracteres.',password:'Nova senha',confirm:'Confirmar senha',submit:'Salvar nova senha',loading:'Salvando...',mismatch:'As senhas não coincidem.',done:'Senha atualizada. Você já pode entrar.',error:'Este link é inválido ou expirou.',generic:'Não foi possível atualizar a senha.',back:'Voltar ao login'},en:{title:'Create a new password',intro:'Choose a new password with at least 12 characters.',password:'New password',confirm:'Confirm password',submit:'Save new password',loading:'Saving...',mismatch:'Passwords do not match.',done:'Password updated. You can now sign in.',error:'This link is invalid or expired.',generic:'Could not update password.',back:'Back to sign in'},es:{title:'Crear nueva contraseña',intro:'Elige una contraseña nueva de al menos 12 caracteres.',password:'Nueva contraseña',confirm:'Confirmar contraseña',submit:'Guardar contraseña',loading:'Guardando...',mismatch:'Las contraseñas no coinciden.',done:'Contraseña actualizada. Ya puedes iniciar sesión.',error:'Este enlace no es válido o ha caducado.',generic:'No se pudo actualizar la contraseña.',back:'Volver al inicio de sesión'}};const $=id=>document.getElementById(id),lang=localStorage.getItem('startingToolkitLanguage')||'pt',t=c[lang]||c.pt,token=new URLSearchParams(location.search).get('token')||'';document.documentElement.lang=lang==='pt'?'pt-BR':lang;for(const [id,key] of [['title','title'],['intro','intro'],['passwordLabel','password'],['confirmLabel','confirm'],['submit','submit'],['back','back']])$(id).textContent=t[key];$('form').addEventListener('submit',async e=>{e.preventDefault();if($('password').value!==$('confirm').value){$('message').textContent=t.mismatch;return}$('submit').disabled=true;$('message').textContent=t.loading;try{const r=await fetch('/api/auth/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:$('password').value})});const d=await r.json();if(!r.ok)throw new Error(r.status===400?t.error:t.generic);$('message').textContent=t.done;$('form').hidden=true}catch(err){$('message').textContent=err.message||t.generic;$('submit').disabled=false}});if(!token){$('message').textContent=t.error;$('submit').disabled=true}</script></body></html>
