<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar senha | Starting Toolkit</title><style>:root{--navy:#172d3b;--teal:#4f8b87;--gold:#c6a66b;--bg:#f5f7f7;--muted:#71818a;--line:#e4e9e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Arial,sans-serif;color:#263943}.card{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 12px 35px #172d3b14}.brand{text-align:center;font-size:20px;font-weight:700;color:var(--navy)}.brand span{color:var(--gold)}h1{text-align:center;color:var(--navy);font-size:24px;margin:28px 0 8px}p{text-align:center;color:var(--muted);line-height:1.5;font-size:14px}label{display:block;font-size:13px;font-weight:bold;margin:20px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd6dc;border-radius:9px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:9px;background:var(--navy);color:white;font-size:15px;font-weight:bold;margin-top:22px;cursor:pointer}button:disabled{opacity:.6}#message{min-height:24px;margin-top:16px;text-align:center;font-size:13px}.back{text-align:center;margin-top:20px;font-size:13px}.back a{color:var(--teal);text-decoration:none}</style></head><body><main class="card"><div class="brand">STARTING<span>TOOLKIT</span></div><h1 id="title">Recuperar senha</h1><p id="intro">Informe seu e-mail. Se houver uma conta, enviaremos um link para redefinir sua senha.</p><form id="form"><label id="emailLabel" for="email">E-mail</label><input id="email" type="email" required autocomplete="email"><button id="submit">Enviar link</button></form><div id="message" role="status"></div><div class="back"><a href="/login.html" id="back">Voltar ao login</a></div></main><script>const c={pt:{title:'Recuperar senha',intro:'Informe seu e-mail. Se houver uma conta, enviaremos um link para redefinir sua senha.',email:'E-mail',submit:'Enviar link',loading:'Enviando...',done:'Se a conta existir, enviaremos um e-mail com as instruções.',error:'Não foi possível enviar agora. Tente novamente.',back:'Voltar ao login'},en:{title:'Reset password',intro:'Enter your email. If an account exists, we will send a password reset link.',email:'Email',submit:'Send link',loading:'Sending...',done:'If the account exists, an email with instructions will be sent.',error:'Could not send now. Please try again.',back:'Back to sign in'},es:{title:'Recuperar contraseña',intro:'Introduce tu correo. Si existe una cuenta, enviaremos un enlace para restablecer la contraseña.',email:'Correo electrónico',submit:'Enviar enlace',loading:'Enviando...',done:'Si la cuenta existe, enviaremos un correo con instrucciones.',error:'No se pudo enviar ahora. Inténtalo de nuevo.',back:'Volver al inicio de sesión'}};const $=id=>document.getElementById(id);const lang=localStorage.getItem('startingToolkitLanguage')||'pt',t=c[lang]||c.pt;document.documentElement.lang=lang==='pt'?'pt-BR':lang;for(const [id,key] of [['title','title'],['intro','intro'],['emailLabel','email'],['submit','submit'],['back','back']])$(id).textContent=t[key];$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent=t.loading;try{const r=await fetch('/api/auth/password-reset-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,language:lang})});if(!r.ok)throw new Error();$('message').textContent=t.done}catch(e){$('message').textContent=t.error;$('submit').disabled=false}});</script></body></html>
