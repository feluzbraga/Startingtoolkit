<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar | Starting Toolkit</title>
<style>
:root{--navy:#172d3b;--teal:#4f8b87;--gold:#c6a66b;--bg:#f5f7f7;--text:#263943;--muted:#71818a;--line:#e4e9e9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.card{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 12px 35px rgba(23,45,59,.08)}
.brand{text-align:center;font-size:20px;font-weight:700;letter-spacing:.5px;color:var(--navy)}.brand span{color:var(--gold)}h1{font-size:25px;color:var(--navy);margin:28px 0 8px;text-align:center}p.sub{color:var(--muted);text-align:center;font-size:14px;margin:0 0 24px}
label{display:block;font-size:13px;font-weight:700;margin:17px 0 7px}input,select{width:100%;padding:13px;border:1px solid #cbd6dc;border-radius:9px;font:inherit;font-size:15px;background:#fff}button{width:100%;padding:14px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;margin-top:22px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#message{min-height:22px;margin-top:16px;font-size:13px;text-align:center;color:#a33}.back{text-align:center;margin-top:20px;font-size:13px}.back a{color:var(--teal);text-decoration:none}
</style></head><body><main class="card"><div class="brand">STARTING<span>TOOLKIT</span></div><h1 id="title">Acesse sua conta</h1><p class="sub" id="subtitle">Entre para continuar seu planejamento.</p>
<label for="language" id="languageLabel">Idioma</label><select id="language"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select>
<form id="loginForm"><label for="email" id="emailLabel">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password" id="passwordLabel">Senha</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Entrar</button></form><div id="message" role="status" aria-live="polite"></div><div class="back"><a href="/" id="backLink">Voltar ao site</a></div></main>
<script>
const copy={pt:{title:'Acesse sua conta',subtitle:'Entre para continuar seu planejamento.',language:'Idioma',email:'E-mail',password:'Senha',submit:'Entrar',loading:'Verificando acesso...',error:'E-mail ou senha incorretos, ou licença inativa.',generic:'Não foi possível entrar. Tente novamente.',back:'Voltar ao site'},en:{title:'Sign in to your account',subtitle:'Sign in to continue your planning.',language:'Language',email:'Email',password:'Password',submit:'Sign in',loading:'Checking your access...',error:'Incorrect email or password, or inactive license.',generic:'Could not sign in. Please try again.',back:'Back to website'},es:{title:'Accede a tu cuenta',subtitle:'Inicia sesión para continuar tu planificación.',language:'Idioma',email:'Correo electrónico',password:'Contraseña',submit:'Entrar',loading:'Verificando acceso...',error:'Correo o contraseña incorrectos, o licencia inactiva.',generic:'No fue posible iniciar sesión. Inténtalo de nuevo.',back:'Volver al sitio'}};
const $=id=>document.getElementById(id);function setLang(lang){const t=copy[lang]||copy.pt;document.documentElement.lang=lang==='pt'?'pt-BR':lang;$('title').textContent=t.title;$('subtitle').textContent=t.subtitle;$('languageLabel').textContent=t.language;$('emailLabel').textContent=t.email;$('passwordLabel').textContent=t.password;$('submit').textContent=t.submit;$('backLink').textContent=t.back;localStorage.setItem('startingToolkitLanguage',lang)}
$('language').value=localStorage.getItem('startingToolkitLanguage')||'pt';setLang($('language').value);$('language').addEventListener('change',e=>setLang(e.target.value));
(async()=>{try{const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});if(r.ok){const d=await r.json();if(d.authenticated&&d.license?.status==='active')location.replace('/modules/dashboard.html')}}catch(e){}})();
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const lang=$('language').value,t=copy[lang];$('message').textContent=t.loading;$('submit').disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const data=await r.json();if(!r.ok)throw new Error(r.status===401||r.status===403?t.error:t.generic);location.replace('/modules/dashboard.html')}catch(err){$('message').textContent=err.message||t.generic;$('submit').disabled=false}});
</script></body></html>
