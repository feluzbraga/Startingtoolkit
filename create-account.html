<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ativar conta | Starting Toolkit</title>
<style>
:root{--navy:#172d3b;--teal:#4f8b87;--gold:#c6a66b;--bg:#f5f7f7;--text:#263943;--muted:#71818a;--line:#e4e9e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}.card{width:min(100%,500px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 12px 35px rgba(23,45,59,.08)}.brand{text-align:center;font-size:20px;font-weight:700;letter-spacing:.5px;color:var(--navy)}.brand span{color:var(--gold)}h1{font-size:25px;color:var(--navy);margin:28px 0 8px;text-align:center}p.sub{color:var(--muted);text-align:center;font-size:14px;line-height:1.5;margin:0 0 24px}label{display:block;font-size:13px;font-weight:700;margin:17px 0 7px}input,select{width:100%;padding:13px;border:1px solid #cbd6dc;border-radius:9px;font:inherit;font-size:15px;background:#fff}input[readonly]{background:#f5f7f7;color:#71818a}button{width:100%;padding:14px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;margin-top:22px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#message{min-height:22px;margin-top:16px;font-size:13px;text-align:center;color:#a33}.back{text-align:center;margin-top:20px;font-size:13px}.back a{color:var(--teal);text-decoration:none}.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style></head><body><main class="card"><div class="brand">STARTING<span>TOOLKIT</span></div><h1 id="title">Ative sua conta</h1><p class="sub" id="subtitle">Sua compra foi confirmada. Crie uma senha para começar a usar o Starting Toolkit.</p><form id="activationForm"><label for="language" id="languageLabel">Idioma</label><select id="language"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select><label for="email" id="emailLabel">E-mail da compra</label><input id="email" type="email" readonly><label for="password" id="passwordLabel">Criar senha</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><div class="hint" id="passwordHint">Use pelo menos 12 caracteres.</div><label for="confirm" id="confirmLabel">Confirmar senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button id="submit" type="submit">Ativar minha conta</button></form><div id="message" role="status" aria-live="polite"></div><div class="back"><a href="/login.html" id="loginLink">Já tenho uma conta. Entrar</a></div></main>
<script>
const copy={pt:{title:'Ative sua conta',subtitle:'Sua compra foi confirmada. Crie uma senha para começar a usar o Starting Toolkit.',language:'Idioma',email:'E-mail da compra',password:'Criar senha',hint:'Use pelo menos 12 caracteres.',confirm:'Confirmar senha',submit:'Ativar minha conta',loading:'Ativando sua conta...',mismatch:'As senhas não coincidem.',error:'Este link é inválido ou expirou. Solicite um novo link de ativação.',generic:'Não foi possível ativar sua conta. Tente novamente.',login:'Já tenho uma conta. Entrar'},en:{title:'Activate your account',subtitle:'Your purchase has been confirmed. Create a password to start using Starting Toolkit.',language:'Language',email:'Purchase email',password:'Create password',hint:'Use at least 12 characters.',confirm:'Confirm password',submit:'Activate my account',loading:'Activating your account...',mismatch:'Passwords do not match.',error:'This link is invalid or expired. Request a new activation link.',generic:'Could not activate your account. Please try again.',login:'Already have an account? Sign in'},es:{title:'Activa tu cuenta',subtitle:'Tu compra ha sido confirmada. Crea una contraseña para empezar a usar Starting Toolkit.',language:'Idioma',email:'Correo de compra',password:'Crear contraseña',hint:'Usa al menos 12 caracteres.',confirm:'Confirmar contraseña',submit:'Activar mi cuenta',loading:'Activando tu cuenta...',mismatch:'Las contraseñas no coinciden.',error:'Este enlace no es válido o ha caducado. Solicita un nuevo enlace.',generic:'No fue posible activar tu cuenta. Inténtalo de nuevo.',login:'Ya tengo una cuenta. Iniciar sesión'}};
const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token')||'';function setLang(l){const t=copy[l]||copy.en;document.documentElement.lang=l==='pt'?'pt-BR':l;$('title').textContent=t.title;$('subtitle').textContent=t.subtitle;$('languageLabel').textContent=t.language;$('emailLabel').textContent=t.email;$('passwordLabel').textContent=t.password;$('passwordHint').textContent=t.hint;$('confirmLabel').textContent=t.confirm;$('submit').textContent=t.submit;$('loginLink').textContent=t.login;localStorage.setItem('startingToolkitLanguage',l)}
(async()=>{if(!token){$('message').textContent=copy.en.error;$('submit').disabled=true;return}try{const r=await fetch('/api/auth/activation-info?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error('invalid');$('email').value=d.email;$('language').value=d.language||'en';setLang($('language').value)}catch(e){$('message').textContent=copy.en.error;$('submit').disabled=true}})();$('language').addEventListener('change',e=>setLang(e.target.value));
$('activationForm').addEventListener('submit',async e=>{e.preventDefault();const l=$('language').value,t=copy[l];if($('password').value!==$('confirm').value){$('message').textContent=t.mismatch;return}$('submit').disabled=true;$('message').textContent=t.loading;try{const r=await fetch('/api/auth/activate',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({token,password:$('password').value,language:l})});const d=await r.json();if(!r.ok)throw new Error(r.status===400?t.error:t.generic);location.replace(d.redirect||'/modules/dashboard.html')}catch(err){$('message').textContent=err.message||t.generic;$('submit').disabled=false}});
</script></body></html>
