<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login de teste - Starting Toolkit</title><style>body{font-family:Arial,sans-serif;background:#f3f5f6;color:#203b4b;margin:0;padding:24px}.card{max-width:520px;margin:30px auto;background:white;padding:28px;border:1px solid #d7e0e5;border-radius:18px}h1{font-size:26px}label{display:block;font-weight:bold;margin:18px 0 7px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cbd6dc;border-radius:10px;font-size:16px}button{width:100%;padding:15px;background:#203b4b;color:white;border:0;border-radius:10px;font-weight:bold;font-size:16px;margin-top:22px}pre{white-space:pre-wrap;background:#f1f4f5;padding:14px;border-radius:10px}</style></head><body><main class="card"><h1>Login de teste</h1><p>Use a conta de teste criada anteriormente. Esta página é temporária.</p><form id="f"><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button>Entrar</button></form><pre id="out">Aguardando...</pre></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('out');out.textContent='Entrando...';try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();out.textContent='HTTP '+r.status+'\n'+JSON.stringify(d,null,2);if(r.ok)setTimeout(()=>location.href='/modules/my-idea.html',700)}catch(err){out.textContent='Erro de conexão: '+err.message}});</script></body></html>
